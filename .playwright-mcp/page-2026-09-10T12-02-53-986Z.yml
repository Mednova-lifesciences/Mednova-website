    - generic [ref=f5e14]:
      - heading "Your Regulatory and Clinical Development Partner for Nigeria and Africa" [level=1] [ref=f5e15]
      - paragraph [ref=f5e16]: Helping pharmaceutical, biotechnology, medical device, and nutraceutical companies navigate regulatory approvals, clinical development, and post-market safety — as one integrated partner rather than three separate vendors.
      - paragraph [ref=f5e17]: We combine local regulatory insight with clinical execution and pharmacovigilance discipline so your project is mapped to compliance objectives from first dose through post-approval monitoring.
      - paragraph [ref=f5e18]: Our approach is designed for teams that want fast, practical decisions without sacrificing quality. From protocol design to safety reporting, MedNova helps you move with confidence in Nigeria and across Africa.
    - generic [ref=f5e20]:
      - generic [ref=f5e21]:
        - generic [ref=f5e22]: Why Africa
        - heading "Research in Africa is changing." [level=2] [ref=f5e23]
        - paragraph [ref=f5e24]: Africa has become one of the world's fastest-growing regions for clinical development — growing research capacity, increasing regulatory maturity, and expanding investigator networks. MedNova helps sponsors turn that opportunity into successful programs.
        - paragraph [ref=f5e25]: Our team supports local protocol feasibility, site readiness, and regulatory submissions so the value of African trials is realized without unexpected compliance delays.
      - generic [ref=f5e26]:
        - generic [ref=f5e27]: Why MedNova
        - heading "Integrated across the product lifecycle." [level=2] [ref=f5e28]
        - paragraph [ref=f5e29]: Registration, trial operations, and drug safety, built to work together rather than change hands between vendors — so a product's journey from market authorization through post-market safety runs through one partner.
        - paragraph [ref=f5e30]: That single-team model keeps handoffs simple and ensures pharmacovigilance, clinical, and regulatory planning are aligned with your commercial objectives.
