      - paragraph [ref=e41]: "Primary source: NAFDAC Good Pharmacovigilance Practice Guidelines (Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021)"
      - paragraph [ref=e42]:
        - strong [ref=e43]: "Short answer:"
        - text: NAFDAC pharmacovigilance requirements oblige every Certificate of Registration Holder placing a medicinal product on the Nigerian market to run a functioning pharmacovigilance system — one that collects, evaluates, documents and reports safety information about that product. Compliance is not satisfied by submitting adverse event reports alone. It requires a named and resident Qualified Person Responsible for Pharmacovigilance, a Pharmacovigilance System Master File held in Nigeria, controlled procedures, trained personnel, risk management, safety communication, audit, and records that prove all of it happened.
