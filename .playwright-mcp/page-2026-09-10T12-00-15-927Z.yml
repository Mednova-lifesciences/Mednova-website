- generic [active] [ref=f4e1]: "// Shared demo widget logic — expects each page to define: // - a <div class=\"demo-questions\"> of <button class=\"demo-q-btn\" data-q=\"...\"> // - a <div id=\"demoOutput\"> // - a <script> tag setting window.DEMO_CONTEXT to one of: // 'general' | 'regulatory' | 'clinical' | 'safety' (function () { const demoButtons = document.querySelectorAll('.demo-q-btn'); const demoOutput = document.getElementById('demoOutput'); if (!demoButtons.length || !demoOutput) return; const context = window.DEMO_CONTEXT || 'general'; function escapeHtml(str) { return str .replace(/&/g, '&amp;') .replace(/</g, '&lt;') .replace(/>/g, '&gt;'); } // Turns the assistant's lightly-markdown-formatted reply (**bold**, // numbered/bulleted lists, paragraph breaks) into real HTML. Input is // HTML-escaped first, so only the tags this function inserts can appear. function formatAssistantReply(raw) { const escaped = escapeHtml(raw.trim()).replace(/\\*\\*(.+?)\\*\\*/g, '<strong>$1</strong>'); const blocks = escaped.split(/\\n\\s*\\n/); return blocks .map((block) => { const lines = block.split('\\n').map((l) => l.trim()).filter(Boolean); if (!lines.length) return ''; if (lines.every((l) => /^\\d+[.)]\\s+/.test(l))) { const items = lines.map((l) => `<li>${l.replace(/^\\d+[.)]\\s+/, '')}</li>`).join(''); return `<ol>${items}</ol>`; } if (lines.every((l) => /^[-*•]\\s+/.test(l))) { const items = lines.map((l) => `<li>${l.replace(/^[-*•]\\s+/, '')}</li>`).join(''); return `<ul>${items}</ul>`; } return `<p>${lines.join(' ')}</p>`; }) .join(''); } async function askDemo(btn) { const question = btn.dataset.q; demoButtons.forEach((b) => b.classList.remove('active')); btn.classList.add('active'); demoButtons.forEach((b) => (b.disabled = true)); demoOutput.textContent = 'Thinking...'; try { const res = await fetch(window.getApiUrl('/api/assistant'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question, context }) }); if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || 'Request failed'); } const data = await res.json(); demoOutput.innerHTML = data.text ? formatAssistantReply(data.text) : '<p>No response received.</p>'; } catch (err) { demoOutput.textContent = \"Couldn't reach the assistant right now — please try again shortly.\"; } finally { demoButtons.forEach((b) => (b.disabled = false)); } } demoButtons.forEach((btn) => btn.addEventListener('click', () => askDemo(btn))); })();"