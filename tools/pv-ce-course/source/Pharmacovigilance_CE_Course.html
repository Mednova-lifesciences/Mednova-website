<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pharmacovigilance CE Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: course binder. A sticky module index on the left, one module at a time on the right,
   examples set as case-file cards, knowledge check as a graded form at the foot of each module. */
:root {
  --paper: #f5f8f9;
  --surface: #ffffff;
  --ink: #142229;
  --muted: #546770;
  --rule: #d5e0e5;
  --accent: #1d5f86;
  --accent-ink: #ffffff;
  --accent-soft: #e6f0f6;
  --case-bg: #eef4f2;
  --case-rule: #2f7a68;
  --ok: #17733f;
  --ok-soft: #e3f3e8;
  --bad: #b02a22;
  --bad-soft: #fbe9e7;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f171b; --surface: #16222a; --ink: #e3ecef; --muted: #9db0b8; --rule: #2a3a43;
    --accent: #7cb8dc; --accent-ink: #0b1418; --accent-soft: #1a2f3c;
    --case-bg: #142621; --case-rule: #5fb39c;
    --ok: #6fd39a; --ok-soft: #133022; --bad: #f08a80; --bad-soft: #3a1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f171b; --surface: #16222a; --ink: #e3ecef; --muted: #9db0b8; --rule: #2a3a43;
  --accent: #7cb8dc; --accent-ink: #0b1418; --accent-soft: #1a2f3c;
  --case-bg: #142621; --case-rule: #5fb39c;
  --ok: #6fd39a; --ok-soft: #133022; --bad: #f08a80; --bad-soft: #3a1a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
a { color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.shell { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 40px; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

/* Index */
.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 860px) { .index { position: static; } }
.brand .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font-size: 24px; margin-top: 4px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter-bar { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.meter-fill { height: 100%; width: 0; background: var(--ok); transition: width .4s ease; }
.meter-text { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.toc button { width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; color: var(--ink); cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 15px; line-height: 1.35; }
.toc button:hover { background: var(--accent-soft); }
.toc button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.toc .n { font-family: var(--font-mono); font-size: 13px; opacity: .75; font-variant-numeric: tabular-nums; }
.toc .st { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.toc .st.done { color: var(--ok); }
.toc button[aria-current="true"] .st.done { color: inherit; }
@media (max-width: 860px) {
  .toc { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .toc li { flex: 0 0 auto; }
  .toc button { grid-template-columns: auto auto; border: 1px solid var(--rule); }
  .toc .t { display: none; }
}

/* Main column */
main { min-width: 0; }
.page { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding-inline: clamp(18px, 4vw, 48px); padding-block: clamp(22px, 4vw, 44px); display: flex; flex-direction: column; gap: 22px; }
.page > * { max-width: 68ch; }
.mod-eyebrow { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.page h2 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 700; }
.page h3 { font-size: 21px; border-top: 1px solid var(--rule); padding-top: 22px; }
.page p, .page ul, .page ol, .page dl { margin: 0; }
.content { display: flex; flex-direction: column; gap: 18px; }
.content ul, .content ol { padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }

.objectives { background: var(--accent-soft); border-radius: 8px; padding: 16px 20px; }
.objectives .lbl, .case-label, .takeaways .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.objectives ul { margin: 8px 0 0; padding-left: 1.2em; }

.case { background: var(--case-bg); border-left: 4px solid var(--case-rule); border-radius: 0 8px 8px 0; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 8px; }
.case-label { color: var(--case-rule); }
.case h4 { font-size: 18px; }
.case blockquote { margin: 0; padding-left: 14px; border-left: 2px solid var(--rule); font-style: italic; }
.case ul { padding-left: 1.2em; margin: 0; }

.terms { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; }
.terms dt { font-weight: 700; }
.terms dd { margin: 0; }
@media (max-width: 560px) { .terms { grid-template-columns: minmax(0, 1fr); } .terms dd { margin-bottom: 8px; } }
.steps { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.steps dt { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; padding-top: 3px; color: var(--case-rule); }
.steps dd { margin: 0; }
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } }

.tbl { overflow-x: auto; max-width: 100% !important; border: 1px solid var(--rule); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15px; line-height: 1.45; }
.tbl th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
.tbl th, .tbl td { padding: 10px 12px; vertical-align: top; border-bottom: 1px solid var(--rule); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl.first-col td:first-child { font-weight: 700; }

.takeaways { border: 2px solid var(--ink); border-radius: 8px; padding: 16px 20px; }
.takeaways ul { margin: 8px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

/* Knowledge check */
.quiz { display: flex; flex-direction: column; gap: 18px; }
.quiz-intro { color: var(--muted); }
.q { border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.q.right { border-color: var(--ok); }
.q.wrong { border-color: var(--bad); }
.q legend { font-weight: 700; padding: 0; float: left; width: 100%; }
.q fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.q .qn { font-family: var(--font-mono); font-weight: 500; color: var(--muted); margin-right: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
.opt:hover { background: var(--accent-soft); }
.opt input { margin-top: 5px; accent-color: var(--accent); flex: 0 0 auto; }
.q.locked .opt { cursor: default; }
.q.locked .opt:hover { background: none; }
.opt.picked-right { background: var(--ok-soft); border-color: var(--ok); }
.opt.picked-wrong { background: var(--bad-soft); border-color: var(--bad); }
.q-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.verdict { font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.verdict.right { color: var(--ok); }
.verdict.wrong { color: var(--bad); }
.verdict-note { color: var(--muted); font-size: 15px; }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.score { border-radius: 8px; padding: 16px 20px; background: var(--paper); border: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.score strong { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }

.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 22px; border-top: 1px solid var(--rule); max-width: none !important; }
.pager .btn { max-width: 100%; }

.intro-list { padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.note { font-size: 15px; color: var(--muted); }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; max-width: none !important; }
.summary-grid button { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.summary-grid button:hover { border-color: var(--accent); }
.summary-grid .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.summary-grid .s { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.summary-grid .s.done { color: var(--ok); }


.toc .grp { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }
@media (max-width: 860px) { .toc .grp { display: none; } }
.sources { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--rule); padding-top: 14px; }
.sources .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.sources ul { margin: 6px 0 0; padding-left: 1.2em; }
.track-head { display: flex; flex-direction: column; gap: 4px; }
.track-head p { color: var(--muted); }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
.pill.pass { color: var(--ok); }
.pill.fail { color: var(--bad); }
.pill.todo { color: var(--muted); }
.req { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.req li { display: flex; gap: 10px; align-items: baseline; }
.req .mark { font-family: var(--font-mono); width: 1.4em; flex: 0 0 auto; }
.req .ok { color: var(--ok); }
.req .no { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; }
.field input { font: inherit; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 420px; }
.cert { max-width: none !important; border: 2px solid var(--ink); border-radius: 4px; padding: clamp(20px, 5vw, 48px); background: var(--surface); position: relative; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; }
.cert::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--rule); border-radius: 2px; pointer-events: none; }
.cert .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.cert .name { font-family: var(--font-display); font-size: clamp(28px, 5vw, 44px); font-weight: 700; border-bottom: 1px solid var(--rule); padding: 0 24px 6px; overflow-wrap: anywhere; }
.cert .course { font-family: var(--font-display); font-size: 20px; font-weight: 500; }
.cert .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cert .meta b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.signin-wrap { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 40px; }
.signin { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: clamp(22px, 5vw, 36px); display: flex; flex-direction: column; gap: 18px; }
.signin h1 { font-size: 26px; }
.signin form { display: flex; flex-direction: column; gap: 14px; }
.signin .field input { max-width: none; width: 100%; }
.field .err { color: var(--bad); font-size: 14px; min-height: 0; }
.field input[aria-invalid="true"] { border-color: var(--bad); }
.who { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.who b { color: var(--ink); overflow-wrap: anywhere; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 14px; }
.cert-img { width: 100%; max-width: 100% !important; height: auto; border: 1px solid var(--rule); box-shadow: 0 6px 24px rgb(0 0 0 / .08); background: #fff; }
.cert-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.reg { max-width: none !important; }
.reg td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const COURSE = {"salt": "e1f0344500583c28d1bebac70b452df5", "modules": [{"title": "Foundations of Pharmacovigilance", "short": "Foundations", "objectives": ["Define pharmacovigilance and describe its main goals", "Summarize the historical events that shaped modern drug safety monitoring", "Explain why safety monitoring must continue after a medicine is approved"], "content": "\n<p><strong>What is pharmacovigilance?<\/strong> Pharmacovigilance (PV) is the science and set of activities for detecting, assessing, understanding and preventing adverse effects or any other medicine-related problems. Put simply, it is the system that keeps watching a medicine for harm for as long as people use it.<\/p>\n<p>Its purpose is to support the safe and rational use of medicines by checking, throughout a product's life, that its benefits still outweigh its risks. That monitoring does not stop when clinical trials end.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>PV in everyday practice<\/h4><p>A pharmacist in Ibadan notices that three patients started on the same new blood-pressure tablet have come back complaining of a persistent dry cough. She reports each case to the national pharmacovigilance centre. On its own, one report proves little. Combined with similar reports from other pharmacies, it helps regulators and the manufacturer judge whether the cough is a real effect of the drug and whether the patient leaflet needs updating. That chain, from noticing to reporting to assessing to acting, is pharmacovigilance.<\/p><\/aside>\n<p><strong>How it started.<\/strong> Modern PV grew out of public health tragedies that exposed the limits of testing before approval. The best known is thalidomide. In the late 1950s and early 1960s this sedative was given to pregnant women for morning sickness and caused severe limb malformations in thousands of babies. The tragedy led regulators to set up spontaneous reporting systems and led to the founding of the WHO Programme for International Drug Monitoring in 1968.<\/p>\n<p><strong>Why trials are not enough.<\/strong> Even large clinical trials usually expose only a few thousand patients, for a limited time, under controlled conditions. Rare effects, or effects that take a long time to appear, often show up only after a medicine reaches a much larger and more varied population.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>The “1 in 10,000” problem<\/h4><p>Suppose a drug causes a serious liver reaction in 1 of every 10,000 patients. A Phase III trial with 3,000 patients may well see no cases at all, so the drug looks safe. Once 2 million people use it after launch, about 200 patients could be affected. Only a post-marketing surveillance system will pick up that pattern.<\/p><\/aside>\n", "takeaways": ["PV = detect, assess, understand and prevent harm from medicines.", "Thalidomide was the catalyst; the WHO programme began in 1968.", "Trials are too small and too short to find every risk, so monitoring continues after approval."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m1q1", "q": "What is the primary purpose of pharmacovigilance?", "o": ["To market medicines more effectively", "To detect, assess, understand, and prevent adverse effects of medicines", "To reduce the cost of drug development", "To replace clinical trials"], "tf": false, "h": "11f4130623aae495bc7235d2bcf9ed97051797f3b6f40a0a9aa3c5524fab6cd9"}, {"id": "m1q2", "q": "Which historical event is most closely associated with the founding of modern pharmacovigilance systems?", "o": ["The discovery of penicillin", "The thalidomide tragedy", "The COVID-19 pandemic", "The invention of MedDRA"], "tf": false, "h": "043a883906879afd6582805b101821b4b3678c5f3d8854f194d0ab708889feb9"}, {"id": "m1q3", "q": "Why can rare adverse effects go undetected during clinical trials?", "o": ["Clinical trials use unqualified staff", "Clinical trials involve a limited number of patients for a limited time", "Clinical trials do not track safety data", "Regulators do not review clinical trial data"], "tf": false, "h": "b079cb3449501894d696065e246445b36a124aa518a73b9375b19fdce229f87e"}, {"id": "m1q4", "q": "True or False: Post-marketing surveillance is unnecessary once a drug is approved.", "o": ["True", "False"], "tf": true, "h": "22b5c5bd457cd0fd702cd1d2122f0c36ea4eca32c1480cb45a0c4f5d497c1153"}, {"id": "m1q5", "q": "The WHO Programme for International Drug Monitoring was established in:", "o": ["1938", "1968", "1990", "2005"], "tf": false, "h": "42aa04937fa19c27089ec823cf5f6cdeb474caf173848f2bace9ab7ad58baeda"}]}, {"title": "The Drug Development Lifecycle and the Role of Pharmacovigilance", "short": "Drug development lifecycle", "objectives": ["Outline the main stages of drug discovery and development", "Describe the purpose of each clinical trial phase", "Explain how PV responsibilities change from before approval to after approval"], "content": "\n<p>A new medicine starts with <strong>drug discovery<\/strong>: researchers identify a biological target and candidate compounds. Next come <strong>preclinical studies<\/strong> in the laboratory and in animals to check basic safety and activity. Compounds that pass move into human clinical trials, run in phases:<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Stage<\/th><th>Who is involved<\/th><th>Main question<\/th><th>Example (a new antimalarial)<\/th><\/tr><\/thead><tbody><tr><td>Preclinical<\/td><td>Cells and animals (no humans)<\/td><td>Is it active and reasonably safe to try in people?<\/td><td>The compound kills malaria parasites in the lab and is tested for toxicity in rodents.<\/td><\/tr><tr><td>Phase I<\/td><td>Small group (often 20–80) of healthy volunteers or patients<\/td><td>Is it safe and tolerable? What dose?<\/td><td>40 healthy adults receive rising doses; researchers record side effects and how the body handles the drug.<\/td><\/tr><tr><td>Phase II<\/td><td>Larger patient group (hundreds)<\/td><td>Does it work? What are the common side effects?<\/td><td>300 patients with uncomplicated malaria are treated to see whether parasites clear.<\/td><\/tr><tr><td>Phase III<\/td><td>Large, often multinational population (thousands)<\/td><td>Confirm it works; find less common side effects<\/td><td>3,000 patients across several countries are compared against the current standard treatment.<\/td><\/tr><tr><td>Phase IV / post-marketing<\/td><td>Everyone who uses it in real life<\/td><td>What happens in routine use over time?<\/td><td>After approval, millions of people, including pregnant women and patients on many other drugs, start using it. Reports of a rare heart-rhythm problem begin to arrive.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Once a regulator reviews the data and grants marketing approval, the medicine enters the post-marketing phase (Phase IV). Here PV becomes the main tool for ongoing safety monitoring. This is where uncommon, delayed or population-specific effects are most likely to be found, because the medicine is now used by a far broader group than was studied in trials.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Who was missing from the trial?<\/h4><p>A Phase III trial for a diabetes drug excluded people over 75 and people with kidney disease. After launch, many elderly patients with reduced kidney function start using it. Reports of low blood sugar episodes in this group start to rise. The trial could not have shown this, because these patients were never in it.<\/p><\/aside>\n", "takeaways": ["Preclinical work is in labs and animals, not humans.", "Phase I = safety and dose; Phase II = does it work; Phase III = confirm and find less common effects; Phase IV = real-world monitoring.", "After approval, the patient population is larger and more varied, so new risks surface."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m2q1", "q": "Which clinical trial phase primarily focuses on initial safety and dosing in a small group?", "o": ["Phase I", "Phase II", "Phase III", "Phase IV"], "tf": false, "h": "c3d3e94378f7447dbb510e76d276de0b2072c1f3d5dfc3d077ae529e88be5544"}, {"id": "m2q2", "q": "What is another common name for the post-marketing surveillance phase?", "o": ["Phase 0", "Phase IV", "Preclinical phase", "Discovery phase"], "tf": false, "h": "d0a781023d5d4e735b0c337bae748cd75c569489adf3fa0212acf01250ed7a64"}, {"id": "m2q3", "q": "Why are rare adverse effects more likely to be found after approval rather than during trials?", "o": ["Trials do not collect safety data", "The post-approval population is larger and more diverse", "Regulators ignore rare events", "Rare effects only occur in animals"], "tf": false, "h": "82a05d610e8fbffc336f6444bf7e7cfe4fc7db9580744b964da528525cabedbb"}, {"id": "m2q4", "q": "True or False: Preclinical studies are conducted in human volunteers.", "o": ["True", "False"], "tf": true, "h": "b0d9cff730cb16547c630ace21f4daa0a73b92721bedd6f06e6b91db1ec5410d"}, {"id": "m2q5", "q": "Phase III trials are primarily designed to:", "o": ["Determine manufacturing costs", "Confirm efficacy and detect less common adverse effects", "Replace the need for post-marketing surveillance", "Test marketing strategies"], "tf": false, "h": "e1ae22e6e3d9b10854ef454f15abd5b6611214cc837441d9c8340da18714e734"}]}, {"title": "Core Concepts and Terminology in Pharmacovigilance", "short": "Core concepts and terminology", "objectives": ["Tell the difference between an adverse event and an adverse drug reaction", "Define seriousness, expectedness and signal", "Use the correct terms when describing a safety case"], "content": "\n<p>Precise terms matter in PV because they decide how a case is processed, how fast it is reported and how it is interpreted.<\/p>\n<dl class=\"terms\">\n<dt>Adverse event (AE)<\/dt><dd>Any unwanted medical occurrence in a patient given a medicine, whether or not the medicine is suspected of causing it.<\/dd>\n<dt>Adverse drug reaction (ADR)<\/dt><dd>An adverse event where a causal link to the medicine is at least reasonably possible.<\/dd>\n<\/dl>\n<p>Every ADR is an AE, but not every AE is an ADR.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>AE or ADR?<\/h4><p><strong>Case A:<\/strong> A patient taking an antibiotic breaks his wrist in a motorcycle accident. This is an adverse event (something bad happened while on the drug), but nobody would reasonably suspect the antibiotic. It is not an ADR.<\/p><p><strong>Case B:<\/strong> A patient develops an itchy rash two days after starting the same antibiotic, and the rash fades after the drug is stopped. A causal link is reasonably possible, so this is an adverse drug reaction.<\/p><\/aside>\n<p><strong>Seriousness<\/strong> is a regulatory category, not a measure of how bad symptoms feel. An event is serious if it:<\/p>\n<ul><li>results in death<\/li><li>is life-threatening<\/li><li>requires hospitalization or prolongs an existing hospital stay<\/li><li>results in persistent or significant disability<\/li><li>causes a congenital anomaly (birth defect)<\/li><li>is otherwise medically significant<\/li><\/ul>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Serious vs. severe<\/h4><p>A severe headache that keeps a patient in bed all day, but needs no hospital stay, is <em>severe<\/em> but not <em>serious<\/em>.<\/p><p>A mild allergic reaction that leads to an overnight hospital admission for observation is <em>serious<\/em> (it required hospitalization), even though the symptoms were mild.<\/p><\/aside>\n<p><strong>Expectedness (listedness)<\/strong> asks whether the event's nature, severity and specificity are already described in the product's reference safety information (for example, the Summary of Product Characteristics or Investigator's Brochure). If not, the event is <em>unexpected<\/em>.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Expected or unexpected?<\/h4><p>The label for a painkiller lists “nausea” and “stomach upset.”<\/p><ul><li>A patient reports nausea → expected.<\/li><li>A patient reports a bleeding stomach ulcer, which the label does not mention → unexpected. It is also more specific and more severe than “stomach upset,” so it cannot be treated as already covered.<\/li><\/ul><\/aside>\n<p><strong>Signal:<\/strong> information suggesting a new, possibly causal link between a medicine and an event (or a new aspect of a known link) that is strong enough to justify further investigation. A signal is a reason to look closer, not proof.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>A signal<\/h4><p>Over six months, a safety team receives 12 reports of hearing loss in patients on a new antifungal. Hearing loss is not on the label, and the background rate in this patient group is low. This cluster is a signal; it needs investigation but does not yet prove the drug causes hearing loss.<\/p><\/aside>\n", "takeaways": ["AE = anything bad that happens on a drug; ADR = an AE the drug may have caused.", "Serious ≠ severe. “Serious” follows fixed criteria (death, life-threatening, hospitalization, disability, birth defect, medically significant).", "Unexpected = not in the reference safety information.", "A signal is a lead to investigate, not a confirmed risk."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m3q1", "q": "Which term implies a suspected causal relationship between a medicine and an event?", "o": ["Adverse event", "Adverse drug reaction", "Signal", "Aggregate report"], "tf": false, "h": "4c9bffc90159c69971bd5ff99e06cd292e7bb4b6dec95dfaf5be0309a1753b95"}, {"id": "m3q2", "q": "Seriousness in pharmacovigilance is best described as:", "o": ["A measure of how severe symptoms feel to the patient", "A regulatory classification based on defined criteria such as hospitalization or death", "Always equivalent to severity", "Irrelevant to reporting timelines"], "tf": false, "h": "7f2b1aa612549a513e8c77a25bf6cdafed869a51a6ecd5246cdc40adbb005b76"}, {"id": "m3q3", "q": "An “unexpected” adverse event is one that:", "o": ["Has never occurred before anywhere", "Is not consistent with the reference safety information for the product", "Is always serious", "Cannot be reported"], "tf": false, "h": "ecfa01c1728a78d0a55f422128839150cda9486a9b68904ec27331dc308a2177"}, {"id": "m3q4", "q": "True or False: Every adverse event is also an adverse drug reaction.", "o": ["True", "False"], "tf": true, "h": "362c0b586f7e1945bbae3642e7d2680076c9753f953e80df2f7412cc9c6f9441"}, {"id": "m3q5", "q": "A “signal” in pharmacovigilance refers to:", "o": ["A confirmed cause-and-effect relationship", "Information suggesting a possible new or changed association that warrants further investigation", "A type of clinical trial", "A marketing communication"], "tf": false, "h": "6b1d1fd4e3c5c1b8be382c507928d6ffefe9dfabc3e7de3b13cf3f0d54fd3132"}]}, {"title": "Individual Case Safety Reports (ICSRs): Sources and Intake", "short": "ICSR sources and intake", "objectives": ["Identify the main sources of ICSRs", "Tell spontaneous reports apart from solicited reports", "Explain why a report's source affects how it is processed"], "content": "\n<p>An <strong>Individual Case Safety Report (ICSR)<\/strong> documents a suspected adverse reaction in one patient linked to one or more medicines. Identifying where a report came from matters, because the source affects causality assumptions, follow-up steps and reporting deadlines.<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Source<\/th><th>What it is<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Spontaneous<\/td><td>Unprompted report from a healthcare professional, patient or consumer<\/td><td>A nurse calls the manufacturer's safety line to say a patient fainted after an injection.<\/td><\/tr><tr><td>Literature<\/td><td>Case found in published articles during routine literature screening<\/td><td>A journal case report describes kidney injury in a child given the company's antibiotic.<\/td><\/tr><tr><td>Solicited<\/td><td>Comes from an organized data-collection programme<\/td><td>A patient in a company-run adherence programme mentions dizziness when a coordinator calls to ask how treatment is going.<\/td><\/tr><tr><td>Regulatory authority<\/td><td>Forwarded by a regulator<\/td><td>The national regulator forwards a report it received of a suspected reaction to the company's product.<\/td><\/tr><tr><td>Partner<\/td><td>From a licensing or contract partner<\/td><td>A distribution partner in Ghana sends a case it received locally.<\/td><\/tr><tr><td>Legal<\/td><td>Arising from lawsuits or product liability claims<\/td><td>A legal claim alleges a patient suffered liver damage from the product.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Why spontaneous vs. solicited matters:<\/strong> in a solicited setting, someone actively asks patients about their health, which naturally produces more reports. For this reason, regulators generally treat solicited reports differently. Many require the reporter or company to give a causality opinion before a solicited case counts as an expedited ADR, whereas a spontaneous report is assumed to carry an implied suspicion from the reporter.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Same event, different handling<\/h4><p><strong>Report 1:<\/strong> A patient phones the company on her own to say she had a seizure after starting a new antidepressant. → <em>Spontaneous.<\/em> The reporter's call implies she suspects the drug.<\/p><p><strong>Report 2:<\/strong> In a company survey, a patient answers “yes” to “Have you had any health problems this month?” and mentions a seizure. → <em>Solicited.<\/em> A causality assessment is needed before deciding how it is reported.<\/p><\/aside>\n", "takeaways": ["An ICSR is about one patient.", "Main sources: spontaneous, literature, solicited, regulatory, partner and legal.", "Source changes causality assumptions, follow-up and timelines."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m4q1", "q": "A report submitted voluntarily by a nurse who noticed a reaction, without any prompting, is best classified as:", "o": ["A solicited report", "A spontaneous report", "A literature report", "A legal report"], "tf": false, "h": "7621ebb0f8450562e2f14002a8f0e4dc1683f5f0962a61564c6a972081c80962"}, {"id": "m4q2", "q": "Reports collected through an organized patient support program are generally classified as:", "o": ["Spontaneous", "Solicited", "Legal", "Regulatory"], "tf": false, "h": "71b72da69eb4e80c7f975fe0238e18c8147bc16a45f29c53991bd18dab32fe3a"}, {"id": "m4q3", "q": "Why does the source of an ICSR matter?", "o": ["It has no real effect on processing", "It affects causality assumptions, follow-up, and reporting timelines", "It only matters for billing purposes", "It determines the color-coding of the file"], "tf": false, "h": "5e9ca8bf4b5cf16e196bb7e5a09c2dcdedebfa0dcfe1f53da3adc1115d1358e2"}, {"id": "m4q4", "q": "True or False: Literature reports come from published case reports or studies identified through literature surveillance.", "o": ["True", "False"], "tf": true, "h": "ec33a165ab91809fa6246c3231c9c575648b57387e1b445f439ea509f0c5827c"}, {"id": "m4q5", "q": "Which of the following is NOT one of the typical ICSR sources described?", "o": ["Legal reports", "Regulatory authority reports", "Spontaneous reports", "Weather reports"], "tf": false, "h": "aa51dc8748844a22d86c2e6cd64ac0f31aef2bb9cc1884b2858f0c57b0b34867"}]}, {"title": "ICSR Case Processing: Validation, Duplicate Search and Coding", "short": "Validation, duplicates and coding", "objectives": ["Describe the minimum criteria for a valid ICSR", "Explain the purpose of duplicate searching", "Understand the role of standard dictionaries such as MedDRA in coding"], "content": "\n<p><strong>Step 1: Validation.<\/strong> Before a case can be processed and submitted, it must be valid. A valid ICSR needs four minimum elements:<\/p>\n<ol><li>An identifiable reporter<\/li><li>An identifiable patient (for example, initials, age, sex or date of birth; a name is not needed)<\/li><li>At least one suspect medicine<\/li><li>At least one adverse event<\/li><\/ol>\n<p>If any element is missing, the case is not valid for regulatory reporting. The information should still be kept, and the team should follow up to get the missing details.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Valid or not?<\/h4><p><strong>Report A:<\/strong> “Dr. Bello, a GP in Abuja, reports that a 45-year-old man developed swelling of the lips after taking amoxicillin.” → Reporter ✓, patient ✓, drug ✓, event ✓ → <em>Valid.<\/em><\/p><p><strong>Report B:<\/strong> A social media post says, “Lots of people are getting rashes from this antibiotic.” → No identifiable patient → <em>Not valid.<\/em> Record it and try to follow up.<\/p><p><strong>Report C:<\/strong> A pharmacist reports that a 30-year-old woman took the product and “is doing fine.” → No adverse event → <em>Not valid as an ICSR.<\/em><\/p><\/aside>\n<p><strong>Step 2: Duplicate search.<\/strong> The same event can reach the company through several channels. The team checks new cases against existing records by comparing details such as patient age and sex, event dates and product information. Duplicates inflate the database and can distort signal detection.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>A duplicate<\/h4><p>On Monday a hospital doctor reports a 62-year-old woman with a severe skin reaction on 3 March after starting carbamazepine. On Thursday the national regulator forwards a report with the same age, sex, drug and event date. These are almost certainly the same patient, so the second report is merged into the first case as follow-up information, not entered as a new case.<\/p><\/aside>\n<p><strong>Step 3: Coding.<\/strong> Coding converts free text into standard terms so data can be grouped and analysed consistently worldwide. Medicines are coded with a drug dictionary (such as WHODrug). Medical events are coded with MedDRA (Medical Dictionary for Regulatory Activities), a hierarchical terminology used by regulators and industry internationally.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Why coding matters<\/h4><p>Three reporters describe the same problem as “heart racing,” “palpitations” and “fast heartbeat.” Without coding, a database search for “palpitations” finds only one case. With MedDRA, all three map to the same standard term, so the team sees three cases. Poor coding could hide a real signal, or split one into pieces too small to notice.<\/p><\/aside>\n", "takeaways": ["Four minimum criteria: reporter, patient, suspect drug, adverse event. A causality assessment is not one of them.", "Duplicate searches stop one event being counted twice.", "MedDRA codes medical events; consistent coding makes signals visible."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m5q1", "q": "Which of the following is NOT one of the four minimum criteria for a valid ICSR?", "o": ["An identifiable reporter", "An identifiable patient", "A suspect product", "A confirmed causality assessment"], "tf": false, "h": "fc84f82fee282bcfc5b82c2a0d2137ea5b48c6264ffac128e7ce35e5b12c2774"}, {"id": "m5q2", "q": "Why is duplicate searching performed on incoming cases?", "o": ["To increase the total case count for reporting metrics", "To prevent redundant cases from distorting safety data and signal detection", "To automatically close cases", "To assign cases to different reviewers"], "tf": false, "h": "1d7e0ff298a06cfe1ddd5bda3fc60512e929d90187dbc07915b97e9301c01cb1"}, {"id": "m5q3", "q": "MedDRA is used primarily to code:", "o": ["Financial data", "Clinical events and medical terms", "Employee records", "Marketing materials"], "tf": false, "h": "91735bd8c478b10b6ff52de127af900bb5707c3d0bb8754ecee1f90ac3e517df"}, {"id": "m5q4", "q": "True or False: A case with no identifiable patient can still be considered a valid ICSR.", "o": ["True", "False"], "tf": true, "h": "d242def5dbbd7b5029063c90f845e56083e809b826dbc2b3408ebdf3f4864c25"}, {"id": "m5q5", "q": "Standardized coding is important because:", "o": ["It has no impact on data analysis", "Inconsistent terminology can obscure real signals or create false ones", "It is only required for legal reports", "It replaces the need for causality assessment"], "tf": false, "h": "0dce002c4b7fe9b8936e9d06f7cfb596179eda197be1cb6e836ee6359d6c317c"}]}, {"title": "Causality Assessment, Narrative Writing and Regulatory Reporting Timelines", "short": "Causality, narratives and timelines", "objectives": ["Explain the purpose of causality assessment in ICSR processing", "Identify the key parts of a well-written case narrative", "Recall the general timeframes for expedited and periodic reporting"], "content": "\n<p><strong>Causality assessment<\/strong> estimates how likely it is that the suspect medicine caused the event. Assessors consider:<\/p>\n<ul><li><strong>Timing:<\/strong> did the event start at a plausible time after the drug was started?<\/li><li><strong>Alternative explanations:<\/strong> could another disease or drug explain it?<\/li><li><strong>Known profile:<\/strong> is this a known effect of the drug or its class?<\/li><li><strong>Dechallenge:<\/strong> did the event improve when the drug was stopped?<\/li><li><strong>Rechallenge:<\/strong> did it come back when the drug was restarted?<\/li><\/ul>\n<p>There is no single definitive method. Most spontaneous reports are treated conservatively as at least “possibly related” unless there is a clear alternative explanation.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Weighing causality<\/h4><p><strong>Strong case:<\/strong> A patient develops a rash 3 days after starting co-trimoxazole. Rash is a known effect. It clears within a week of stopping the drug (positive dechallenge) and returns when she accidentally takes it again (positive rechallenge). → <em>Probable/likely related.<\/em><\/p><p><strong>Weak case:<\/strong> A patient on a cholesterol drug for 4 years is diagnosed with a broken leg after a fall. There is a clear alternative explanation and no known link. → <em>Unlikely related.<\/em><\/p><\/aside>\n<p>The <strong>case narrative<\/strong> is a short, chronological summary of the case. It should let a reviewer understand what happened without opening the source documents. A good narrative covers:<\/p>\n<ul><li>Patient details (age, sex) and relevant medical history<\/li><li>Suspect and concomitant (other) medicines, with doses and dates<\/li><li>The adverse event: when it began, what happened, how it was treated<\/li><li>The outcome<\/li><\/ul>\n<p>Use plain, objective language. Do not speculate beyond what the data show.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Sample narrative<\/h4><blockquote>A 58-year-old female with a history of hypertension and type 2 diabetes was started on Drug X 10 mg daily on 2 May 2026 for hyperlipidaemia. Concomitant medicines were amlodipine 5 mg daily and metformin 500 mg twice daily. On 20 May 2026 she reported muscle pain and weakness in both legs. On 22 May she was admitted to hospital; creatine kinase was 8,500 U/L (normal &lt;200). Drug X was stopped on admission and she was treated with IV fluids. Symptoms improved over five days, and she was discharged on 28 May 2026. At last follow-up on 10 June 2026 she had recovered. The reporting physician considered the event possibly related to Drug X.<\/blockquote><p>Compare a weak version: <q>Patient had muscle problems from the new drug and went to hospital, now fine.<\/q> It is missing dates, history, other medicines, test results and outcome details, and it states a cause as fact.<\/p><\/aside>\n<p><strong>Reporting timelines<\/strong> depend on seriousness and expectedness. Reactions that are serious and unexpected are the most urgent and usually need expedited reporting within days of the company first learning of them. In many jurisdictions this is 15 calendar days for post-marketing cases, and as short as 7 days for fatal or life-threatening unexpected reactions in clinical trials. Always check the local regulator's rules. Less urgent cases are usually compiled into periodic aggregate reports rather than sent one at a time.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Which clock applies?<\/h4><p>Day 0 is the day anyone in the company first receives the minimum information for a valid case.<\/p><ul><li>Serious + unexpected (e.g., unlisted liver failure needing hospitalization) → expedited report, typically within 15 days.<\/li><li>Non-serious + expected (e.g., mild nausea that is on the label) → included in the next periodic report.<\/li><\/ul><\/aside>\n", "takeaways": ["Causality looks at timing, alternatives, known profile, dechallenge and rechallenge.", "A good narrative is chronological, complete and objective.", "Serious + unexpected = fastest reporting. Other cases usually go in periodic reports."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m6q1", "q": "Causality assessment primarily evaluates:", "o": ["The cost of the medicine", "The likelihood that the medicine caused the reported event", "The manufacturing batch number", "The patient's insurance status"], "tf": false, "h": "d6a6f4b449c80c4a7ad5165f1fe051b98d88503be0db9c0282a5bc3ac27f1856"}, {"id": "m6q2", "q": "A well-written case narrative should:", "o": ["Include speculation not supported by the data", "Allow a reviewer to understand the case without consulting raw source documents", "Omit the patient's medical history", "Be written only in medical jargon"], "tf": false, "h": "595481e522fe98e19449f0aeac37a55a9fbfe5ae06a8afefe1b4eebf668a37da"}, {"id": "m6q3", "q": "Which category of adverse reaction typically requires the fastest expedited reporting?", "o": ["Non-serious and expected", "Serious and unexpected", "Non-serious and unexpected", "Serious and expected only"], "tf": false, "h": "4274172632179cd3656ef53410a20f1ab3bb8ff824c0e955f7305e6fb718e6e4"}, {"id": "m6q4", "q": "True or False: All adverse event reports must be submitted individually within 24 hours regardless of seriousness.", "o": ["True", "False"], "tf": true, "h": "1117c91b30ec8944a7b6ea3aa6f17e6450ad348a169589f9f163bb5ca962bee1"}, {"id": "m6q5", "q": "Less urgent, non-expedited cases are typically reported through:", "o": ["Immediate phone calls to regulators", "Periodic aggregate reports", "Press releases", "They are not reported at all"], "tf": false, "h": "b1a8dd6afde07bb6d03a97b384d8c8c3820f67ae204fd670e492849dcc1e0279"}]}, {"title": "Special Situation Reports and Aggregate Safety Reporting", "short": "Special situations and aggregate reports", "objectives": ["Identify the categories of special situation reports", "Explain why special situations are tracked even without a confirmed adverse event", "Describe the purpose of the main aggregate report types"], "content": "\n<p>Some situations are tracked even when no adverse event has happened, because the information itself has safety value. These <strong>special situations<\/strong> include:<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Special situation<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Pregnancy or breastfeeding exposure<\/td><td>A woman discovers she is 8 weeks pregnant while taking an anti-epileptic. She is well, but the pregnancy is followed up to record the baby's outcome.<\/td><\/tr><tr><td>Use in children or the elderly outside studied groups<\/td><td>A drug approved for adults is given to a 6-year-old.<\/td><\/tr><tr><td>Overdose<\/td><td>A patient takes three times the prescribed dose by mistake and has no symptoms.<\/td><\/tr><tr><td>Abuse or misuse<\/td><td>A patient crushes and injects tablets meant to be swallowed.<\/td><\/tr><tr><td>Off-label use<\/td><td>A doctor prescribes a drug for a condition not listed on its label.<\/td><\/tr><tr><td>Medication error<\/td><td>A pharmacy dispenses a similar-sounding drug in error; the patient notices before taking it.<\/td><\/tr><tr><td>Occupational exposure<\/td><td>A nurse splashes a cytotoxic drug on her skin while preparing an infusion.<\/td><\/tr><tr><td>Lack of efficacy<\/td><td>An antimalarial fails to clear fever in several patients from the same batch.<\/td><\/tr><tr><td>Suspected quality defect or counterfeit<\/td><td>Tablets are discoloured and crumble, and the pack has a misspelled brand name.<\/td><\/tr><tr><td>Suspected transmission of an infectious agent<\/td><td>A patient develops an infection traced to a contaminated batch of an injectable.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Tracking these lets safety teams see risk patterns early, before a clear harm has been confirmed. For instance, a cluster of lack-of-efficacy reports can be the first sign of counterfeit products in a market.<\/p>\n<p><strong>Aggregate safety reports<\/strong> pull together safety data over a set period instead of describing one case:<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Report<\/th><th>When<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>DSUR (Development Safety Update Report)<\/td><td>During clinical development, usually yearly<\/td><td>An annual review of the investigational product's safety profile across all trials<\/td><\/tr><tr><td>PBRER (Periodic Benefit-Risk Evaluation Report), still called PSUR (Periodic Safety Update Report) in some regions<\/td><td>After marketing approval, at set intervals<\/td><td>Brings together all available data into an updated benefit-risk assessment<\/td><\/tr><tr><td>PADER (Periodic Adverse Drug Experience Report)<\/td><td>After approval, in some jurisdictions (notably the US)<\/td><td>A periodic summary of adverse drug experiences for approved products<\/td><\/tr><\/tbody><\/table><\/div>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>A PBRER in action<\/h4><p>A blood-pressure medicine has been marketed for three years. Its PBRER for the period reviews 1,200 new case reports, new published studies and estimated patient exposure. It concludes that a previously suspected link to angioedema is now confirmed, but that the overall benefit-risk balance remains positive. It recommends a label update.<\/p><\/aside>\n", "takeaways": ["Special situations (pregnancy, overdose, errors, misuse, off-label use, lack of efficacy, quality defects, etc.) are reported even with no harm.", "DSUR = development phase. PBRER/PSUR = marketed products, benefit-risk focus. PADER = periodic report in some jurisdictions."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m7q1", "q": "Which of the following is an example of a “special situation” report?", "o": ["Use of a medicine during pregnancy", "A routine refill of a prescription", "A scheduled physician visit", "A change in drug pricing"], "tf": false, "h": "5854f558b2b6f2297d7364528f1c3214775ec2aa4b77f6aa143acc8586f5d3f9"}, {"id": "m7q2", "q": "Why are special situations tracked even without a confirmed adverse event?", "o": ["They have no real safety value", "The information can help monitor emerging risk patterns", "Regulators require it only for cosmetic products", "It is optional and rarely done"], "tf": false, "h": "efdea82751c411a51e88c6f5797c7c815c35fc3e89189106bc38cd9db0169203"}, {"id": "m7q3", "q": "The DSUR is primarily associated with which stage of a product's life cycle?", "o": ["Post-marketing only", "Clinical development", "Manufacturing only", "Advertising"], "tf": false, "h": "84a4d2335c67659e8b94f8c495bbb128f9fbb42fe35a60a454988daa7a22f6c2"}, {"id": "m7q4", "q": "True or False: PBRER and the older term PSUR refer to related periodic report concepts for marketed products.", "o": ["True", "False"], "tf": true, "h": "c911bb4f7e54a6f0abfd49704b850f8eb1a3026b2436205f5a72b6b46bed8819"}, {"id": "m7q5", "q": "Which report type integrates available safety data into an updated benefit-risk assessment for marketed products?", "o": ["DSUR", "PBRER/PSUR", "Case narrative", "Signal detection report"], "tf": false, "h": "af6c4012fe5159eec6f54500093cb7c10656c9412874c9c28f93a87902a7d084"}]}, {"title": "Signal Management: From Detection to Action", "short": "Signal management", "objectives": ["Define a safety signal", "Outline the stages of the signal management process", "Explain the possible outcomes once a signal is assessed"], "content": "\n<p><strong>Signal management<\/strong> is the structured process for finding, evaluating and acting on possible new safety information. It runs in stages:<\/p>\n<ol class=\"stages\">\n<li><strong>Detection:<\/strong> statistical methods and clinical review of combined case data are used to spot patterns that may point to a new or poorly understood risk.<\/li>\n<li><strong>Prioritization:<\/strong> signals are ranked by the seriousness of the possible event, the strength of the evidence and how many people are exposed.<\/li>\n<li><strong>Validation:<\/strong> the data are reviewed more closely to rule out reporting bias, data-quality problems or chance.<\/li>\n<li><strong>Analysis:<\/strong> all relevant data (cases, literature, trials, mechanism, exposure) are examined together to characterize the risk.<\/li>\n<li><strong>Assessment and recommendation:<\/strong> the team decides what, if anything, should be done.<\/li>\n<\/ol>\n<p>Possible outcomes include updating the product information, communicating new risk information to healthcare professionals or patients, starting further studies, or regulatory action up to market withdrawal. Many signals are found, once fully evaluated, to need no action.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Following one signal through the process<\/h4><dl class='steps'><dt>Detection<\/dt><dd>Disproportionality analysis shows “pancreatitis” is reported for a new diabetes drug about four times more often than for other drugs in the database.<\/dd><dt>Prioritization<\/dt><dd>Pancreatitis can be life-threatening and the drug is widely used → high priority.<\/dd><dt>Validation<\/dt><dd>Reviewers check for duplicates and confirm the cases are real pancreatitis with supporting lab results, not miscoded abdominal pain. Twenty well-documented cases remain.<\/dd><dt>Analysis<\/dt><dd>Several cases show onset within weeks and recovery after stopping the drug. Similar drugs in the same class have a known pancreatitis risk.<\/dd><dt>Assessment<\/dt><dd>The team concludes there is a likely causal link. Action: add pancreatitis to the warnings section of the label and send a letter to prescribers.<\/dd><\/dl><\/aside>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>A signal that is closed<\/h4><p>A spike in “headache” reports for a vaccine follows a news story about the vaccine. Validation shows the reports are mostly mild, expected and driven by media attention (stimulated reporting). The signal is closed with no action.<\/p><\/aside>\n", "takeaways": ["Stages: detect → prioritize → validate → analyse → assess and act.", "Prioritize by seriousness, strength of evidence and exposure.", "Not every signal becomes a confirmed risk."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m8q1", "q": "What is the first stage of the signal management process described here?", "o": ["Signal analysis", "Signal detection", "Regulatory withdrawal", "Aggregate reporting"], "tf": false, "h": "81fea5ae1728a22de422731f8d7e8fede390e236ae43e30e200f1e45cb5a5884"}, {"id": "m8q2", "q": "Signal prioritization considers factors such as:", "o": ["Marketing budget", "Seriousness, strength of evidence, and population exposure", "Patient satisfaction scores", "Manufacturing location"], "tf": false, "h": "2a568ccb3a9c8ccd75cfcaa8b4cacbc0d14df5edb08caae9a04474bdd4a4267c"}, {"id": "m8q3", "q": "The purpose of signal validation is to:", "o": ["Immediately withdraw the product", "Confirm the pattern is not simply due to bias, data quality issues, or chance", "Skip further analysis", "Replace the need for causality assessment"], "tf": false, "h": "201f77bd4e24642412d7f84c42682609e909af6dfcbb277e4b946e491c2a4f82"}, {"id": "m8q4", "q": "True or False: Every detected signal is ultimately confirmed as a real risk requiring regulatory action.", "o": ["True", "False"], "tf": true, "h": "f835dd5000036f4c7e2f9c125a9d79525b9ec2cd9f8cb76fe85843bd364dcb01"}, {"id": "m8q5", "q": "Which of the following is a possible outcome of a completed signal assessment?", "o": ["Updating product safety information", "Ignoring the finding permanently", "Deleting the case data", "Automatic product recall in all cases"], "tf": false, "h": "d88e8f4915fe30d102894a108696263e9185a73f8a39d006d68acec93bc1c8bb"}]}, {"title": "Specialized Vigilance: Vaccines, Medical Devices and Herbal Products", "short": "Vaccines, devices and herbals", "objectives": ["Describe how vaccine PV differs from PV for medicines", "Define materiovigilance and herbavigilance", "Recognize the special causality considerations in each area"], "content": "\n<p><strong>Vaccine pharmacovigilance<\/strong> focuses on <strong>Adverse Events Following Immunization (AEFI)<\/strong>. The neutral term “following” is used on purpose: vaccines are often given to healthy people, including children, so a causal link must be established carefully. An AEFI may be caused by:<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Cause<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>The vaccine product itself<\/td><td>Fever and a sore arm the day after a vaccine.<\/td><\/tr><tr><td>A vaccine quality defect<\/td><td>Several reactions from one batch that was not manufactured correctly.<\/td><\/tr><tr><td>An immunization error (programmatic error)<\/td><td>An abscess at the injection site because a multi-dose vial was contaminated or stored wrongly.<\/td><\/tr><tr><td>Immunization anxiety-related reaction<\/td><td>A teenager faints in the queue from fear of the needle.<\/td><\/tr><tr><td>Coincidental event<\/td><td>A baby develops malaria fever two days after vaccination; the illness would have happened anyway.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Reportable AEFIs are generally those that are serious, unexpected, or clustered in a way that suggests a common cause.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>An AEFI cluster<\/h4><p>Four children vaccinated at the same rural clinic on the same day develop swelling and abscesses at the injection site. All were vaccinated from the same multi-dose vial. Investigation finds the vial was kept beyond its discard time without refrigeration. The cause is a programmatic (immunization) error, not the vaccine itself. The fix is staff retraining and cold-chain checks, not withdrawing the vaccine.<\/p><\/aside>\n<p><strong>Materiovigilance<\/strong> is the equivalent discipline for medical devices. It covers device-related incidents such as malfunctions, use errors or design flaws that could harm patients.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Materiovigilance<\/h4><p>Several hospitals report that a brand of infusion pump occasionally delivers drugs faster than programmed after a software update. This is a device incident, reported and investigated through materiovigilance. The outcome may be a software fix and a field safety notice to users.<\/p><\/aside>\n<p><strong>Herbavigilance<\/strong> applies PV principles to herbal and traditional medicines. These are hard to monitor because composition can vary between batches or makers, products may be contaminated or adulterated, and interactions with conventional medicines are often poorly understood.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Herbavigilance<\/h4><p>A patient stable on warfarin starts a herbal “blood tonic” bought at a local market and is admitted with severe bleeding. Testing shows the tonic contains ingredients that boost warfarin's effect. The case should be reported, with full details of the herbal product (name, seller, batch and ingredients if known), because it may affect other patients using the same product.<\/p><\/aside>\n<p><strong>What links all three:<\/strong> the shared goal of detecting, assessing and preventing harm, adapted to each product type.<\/p>\n", "takeaways": ["AEFI = Adverse Event Following Immunization. Not every AEFI is caused by the vaccine.", "Materiovigilance = medical devices. Herbavigilance = herbal and traditional medicines.", "Each area adapts PV principles to its own product type."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m9q1", "q": "AEFI stands for:", "o": ["Adverse Event Following Immunization", "Annual Efficacy Follow-up Index", "Adverse Effect From Ingredients", "Approved Evaluation For Immunization"], "tf": false, "h": "fd7eba76c8f872eb930284580dafc8cbbd27ae36fee9ce460b8d0e063924df08"}, {"id": "m9q2", "q": "Why is causality assessment for AEFIs treated with particular care?", "o": ["Vaccines are never associated with any risk", "Coincidental illness or programmatic errors can also produce an AEFI unrelated to the vaccine itself", "AEFIs are never reportable", "Only adults receive vaccines"], "tf": false, "h": "ea79732014017573357ba4e7ac2edb5e84dc3e777f31e5ea1a2af73b77189f92"}, {"id": "m9q3", "q": "Materiovigilance refers to the safety monitoring of:", "o": ["Herbal medicines", "Medical devices", "Vaccines only", "Food products"], "tf": false, "h": "b047387b7e474352ae0edce72f327eb430fa41fb29a5780744c1dd8c14d2dcbd"}, {"id": "m9q4", "q": "True or False: Herbal products present unique pharmacovigilance challenges because composition can vary between batches or manufacturers.", "o": ["True", "False"], "tf": true, "h": "bd697e5e60d0c1cf49e8836e915f99565b1ba9d28d64bca9d213410ecd344ec0"}, {"id": "m9q5", "q": "What do vaccine, device, and herbal vigilance disciplines have in common?", "o": ["Nothing; they are unrelated fields", "The shared goal of detecting, assessing, and preventing harm, adapted to each product type", "They all use identical causality frameworks with no adaptation", "They are not regulated"], "tf": false, "h": "fb5d5d29c2b139379c9ee725e2c6f6611632b5ca587d834a59119446f9e3e6e5"}]}, {"title": "Risk Management Plans, REMS, and PV Inspections and Audits", "short": "RMPs, REMS, inspections and audits", "objectives": ["Explain the purpose of a Risk Management Plan (RMP)", "Describe how a REMS differs from an RMP", "Tell a pharmacovigilance inspection apart from an audit"], "content": "\n<p>A <strong>Risk Management Plan (RMP)<\/strong> is a structured document, required in many jurisdictions, that sets out:<\/p>\n<ul><li>the medicine's known and potential risks, and important missing information<\/li><li>how those risks will be monitored (pharmacovigilance activities)<\/li><li>any extra steps to minimize risk beyond the standard label, such as educational materials or controlled distribution<\/li><\/ul>\n<p>RMPs are living documents, updated as new safety information emerges during the product's life.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>An RMP for an acne medicine that can harm unborn babies<\/h4><dl class='steps'><dt>Important identified risk<\/dt><dd>Birth defects if taken during pregnancy.<\/dd><dt>Monitoring<\/dt><dd>Routine case reporting plus a pregnancy registry to follow every exposed pregnancy.<\/dd><dt>Additional risk minimization<\/dt><dd>A pregnancy prevention programme with prescriber checklists, patient information cards, and a required negative pregnancy test before each prescription.<\/dd><\/dl><p>When new data show that some women are not getting monthly tests, the RMP is updated with stronger pharmacy checks.<\/p><\/aside>\n<p>In the United States, a comparable but separate tool is the <strong>Risk Evaluation and Mitigation Strategy (REMS)<\/strong>. The FDA may require a REMS for a specific medicine when it decides extra measures are needed to make sure benefits outweigh risks. Complying with an approved REMS is generally a condition of continued marketing.<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th><\/th><th>RMP<\/th><th>REMS<\/th><\/tr><\/thead><tbody><tr><td>Where<\/td><td>Many jurisdictions (e.g., EU, UK, and many others that follow similar models)<\/td><td>United States<\/td><\/tr><tr><td>Who needs one<\/td><td>Generally required for new marketing applications<\/td><td>Only specific products the FDA decides need extra measures<\/td><\/tr><tr><td>Example<\/td><td>Most new medicines have an RMP, even if it lists only routine measures<\/td><td>A medicine dispensed only through certified pharmacies after the prescriber confirms required lab monitoring<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Inspections vs. audits.<\/strong> PV systems are overseen in two ways:<\/p>\n<dl class=\"terms\">\n<dt>Inspection<\/dt><dd>Carried out by a regulatory authority to check that a company's safety system meets legal requirements. Findings can lead to formal corrective-action demands or enforcement.<\/dd>\n<dt>Audit<\/dt><dd>Carried out internally or by independent auditors on the company's behalf. It is a proactive quality tool to find and fix gaps before a regulator does.<\/dd>\n<\/dl>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Audit first, inspection later<\/h4><p>In January, a company commissions an independent PV audit. The auditors find that 12% of serious cases last year were submitted after the 15-day deadline, because weekend emails to the safety inbox were not checked. The company sets up weekend monitoring and retrains staff (a corrective and preventive action, or CAPA). In June, the national regulator inspects. Inspectors see the problem was found, fixed and documented, so it is not raised as a major finding.<\/p><\/aside>\n", "takeaways": ["RMP = risks + how to monitor them + how to minimize them. It is a living document.", "REMS = the US equivalent for specific products; compliance is a condition of staying on the market.", "Inspection = by the regulator. Audit = by or for the company, proactive."], "track": "Part 1: Foundations", "trackBlurb": "The core science, vocabulary and processes of pharmacovigilance.", "sources": null, "quiz": [{"id": "m10q1", "q": "An RMP primarily describes:", "o": ["Marketing strategy for a new product", "Known and potential risks and the plan to monitor and minimize them", "Manufacturing costs", "Employee training schedules"], "tf": false, "h": "ce617ad5b1122dcdb6f9b49c146792a8cdb84faa3518ac9d6011b45508af2a75"}, {"id": "m10q2", "q": "A REMS is most closely associated with which regulatory context?", "o": ["The European Union exclusively", "The United States", "Global harmonization only", "Herbal product registration"], "tf": false, "h": "ef8ee1049e712cf1dfb6421c66c3766b5a913636c6b1e6133f2f704c9e5afa10"}, {"id": "m10q3", "q": "What is a key difference between a pharmacovigilance inspection and an audit?", "o": ["There is no difference", "Inspections are conducted by regulators; audits are typically internal or independent, proactive reviews", "Audits are always more severe than inspections", "Only inspections examine safety data"], "tf": false, "h": "9255aabf35b39c761d3765d379b2277ec1842e0f389efca84b141afdfd7c976e"}, {"id": "m10q4", "q": "True or False: RMPs are static documents that never change after initial approval.", "o": ["True", "False"], "tf": true, "h": "bb92264416938f382a2d9c1c83ad3ed4424ed575c8cd22251c8b455490feaafe"}, {"id": "m10q5", "q": "Compliance with an approved REMS is generally:", "o": ["Optional", "A condition of continued marketing", "Only relevant during clinical trials", "Unrelated to patient safety"], "tf": false, "h": "9687d8ecf4bfb61b6188e4e79d903ea4fb4ef9185717361eccd2fc9c592fc442"}]}, {"title": "The Nigerian Pharmacovigilance System and NAFDAC Requirements", "short": "NAFDAC and the Nigerian PV system", "objectives": ["Describe how pharmacovigilance is organised in Nigeria", "Identify the NAFDAC documents that set PV obligations for companies", "Explain the core duties of a Certificate of Registration Holder (CRH) and its QPPV"], "content": "\n<p><strong>Who runs PV in Nigeria.<\/strong> The National Agency for Food and Drug Administration and Control (NAFDAC) regulates medicines in Nigeria. Its <strong>Pharmacovigilance and Post-Marketing Surveillance (PV/PMS) Directorate<\/strong> hosts the <strong>National Pharmacovigilance Centre (NPC)<\/strong>. The NPC was set up in 2003 and on 9 September 2004 Nigeria became the 74th full member of the WHO Programme for International Drug Monitoring. Reports collected in Nigeria are entered in VigiFlow and shared with the WHO global database, VigiBase.<\/p>\n<p>The NPC is supported by <strong>six zonal pharmacovigilance centres<\/strong>, one in each geopolitical zone, mostly based in teaching hospitals, and by PV units in health facilities. The PV/PMS Directorate also coordinates the <strong>National Drug Safety Advisory Committee (NDSAC)<\/strong>, runs PV inspections, issues medicine safety communications, and works with companies on Risk Management Plans.<\/p>\n<p><strong>How reports reach NAFDAC.<\/strong><\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Channel<\/th><th>Used by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Yellow Form (paper ADR form)<\/td><td>Healthcare professionals<\/td><td>The traditional national form; can be scanned and emailed<\/td><\/tr><tr><td>VigiFlow e-reporting form<\/td><td>Healthcare professionals and the public<\/td><td>Online form linked from the NAFDAC PV/PMS web page<\/td><\/tr><tr><td>Med Safety mobile app<\/td><td>Healthcare professionals and the public<\/td><td>Reports ADRs and suspected substandard or falsified medicines; NAFDAC released an upgraded version in 2026<\/td><\/tr><tr><td>Company (CRH) submissions<\/td><td>Certificate of Registration Holders<\/td><td>Mandatory reporting of ICSRs and periodic reports in line with the GVP guidelines<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Reporting is <em>voluntary<\/em> for healthcare professionals but <em>mandatory<\/em> for companies that hold a NAFDAC Certificate of Registration.<\/p>\n<p><strong>The rulebook.<\/strong> The core document is the <em>NAFDAC Good Pharmacovigilance Practice (GVP) Guidelines<\/em> (Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021). The first edition (2016) was adapted from the European Medicines Agency's GVP modules, so its structure and vocabulary will be familiar to anyone trained on EU GVP. It covers the PV system and quality system, the Pharmacovigilance System Master File (PSMF), the Risk Management System, safety communication, adverse reaction reporting (ICSRs and PSURs), post-authorisation safety studies and PV audit. Clinical trial safety reporting is handled separately under NAFDAC's clinical trial and Good Clinical Practice guidelines.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Check the version you are working to<\/h4><p>The 2021 GVP guidelines list a review date of 20 January 2026. Before you rely on any timeline or template, check the NAFDAC website for a newer edition and note the exact document reference and version in your SOPs and reports. Inspectors look for this.<\/p><\/aside>\n<p><strong>The company's obligations.<\/strong> NAFDAC calls the company a <strong>Certificate of Registration Holder (CRH)<\/strong>, the Nigerian equivalent of a marketing authorisation holder. A CRH must run a pharmacovigilance system with a quality system behind it. Under the 2021 guidelines, the CRH must:<\/p>\n<ul><li>have a <strong>Qualified Person for Pharmacovigilance (QPPV)<\/strong> permanently and continuously at its disposal, and send NAFDAC the QPPV's name and contact details<\/li><li>make sure the QPPV <strong>resides and operates in Nigeria<\/strong>, with back-up arrangements for absence<\/li><li>make the QPPV the single PV contact point for NAFDAC, available on a <strong>24-hour basis<\/strong><\/li><li>have only one QPPV per PV system (one QPPV may serve more than one CRH if they can meet every obligation)<\/li><li>maintain a <strong>PSMF<\/strong> located at a site in Nigeria and submit it when applying for a Certificate of Registration<\/li><li>collect, assess and submit safety data within the legal time limits and respond fully and promptly to any NAFDAC request<\/li><\/ul>\n<p>The QPPV needs management skills and expertise in medicine, pharmaceutical sciences, epidemiology and biostatistics, or access to that expertise.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>A multinational entering Nigeria<\/h4><p>A company registers its first product in Nigeria. Its global QPPV sits in Europe. Under the NAFDAC guidelines that is not enough on its own: the company appoints a Nigerian-resident QPPV, names a deputy, submits both sets of contact details to NAFDAC, and sets up a Nigerian PSMF that describes how local cases flow to the global safety database and back out to NAFDAC on time.<\/p><\/aside>\n", "takeaways": ["NAFDAC's PV/PMS Directorate hosts the NPC; Nigeria joined the WHO programme in 2004.", "Healthcare professionals report voluntarily (Yellow Form, VigiFlow e-form, Med Safety app); CRHs must report.", "The 2021 NAFDAC GVP guidelines are based on EU GVP. Always confirm you hold the current version.", "The QPPV must live and work in Nigeria, be reachable 24 hours a day, and have a back-up."], "track": "Part 2: PV practice and NAFDAC", "trackBlurb": "Company PV practice in Nigeria: ICSR management, regulatory writing, DSURs, PSURs, RMPs, the PSMF and inspection readiness.", "sources": ["NAFDAC Good Pharmacovigilance Practice Guidelines, Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021", "NAFDAC PV/PMS Directorate web pages (reporting channels)", "PAVIA baseline assessment of pharmacovigilance in Nigeria (2023)"], "quiz": [{"id": "m11q1", "q": "Which NAFDAC directorate hosts the National Pharmacovigilance Centre?", "o": ["Drug Evaluation and Research", "Pharmacovigilance and Post-Marketing Surveillance", "Registration and Regulatory Affairs", "Ports Inspection"], "tf": false, "h": "e4a970dc69e5e9d431d01ab70bda3d13f6eaa95c00f924812c0e70ce28cc6d8b"}, {"id": "m11q2", "q": "Nigeria became a full member of the WHO Programme for International Drug Monitoring in:", "o": ["1968", "1995", "2004", "2016"], "tf": false, "h": "cb507a4203b93805e7110ad6643f632ea17518e761e469b27e826dc99fb497fe"}, {"id": "m11q3", "q": "What does NAFDAC call the company that holds a product's registration?", "o": ["Certificate of Registration Holder (CRH)", "Sponsor of record", "Local technical representative", "Product licence agent"], "tf": false, "h": "03a4f970141f8c95372bf09cb5672d2f0a355e0aa0128220788effb413ec63bf"}, {"id": "m11q4", "q": "Under the 2021 NAFDAC GVP guidelines, where should the QPPV reside and operate?", "o": ["Anywhere in West Africa", "In the country of the global safety database", "In Nigeria", "Wherever the CRH's headquarters is"], "tf": false, "h": "c280f560f7bb0e6b24c841f653645000f0505f39ef6385f6e0d940208b2c78e5"}, {"id": "m11q5", "q": "True or False: ADR reporting to NAFDAC is mandatory for Certificate of Registration Holders.", "o": ["True", "False"], "tf": true, "h": "9a5c6b85bbd44922380ea102181b63474e22c4f65467a0b556018c9ff4bfd135"}, {"id": "m11q6", "q": "The NAFDAC GVP guidelines were originally adapted from which source?", "o": ["The EMA's Good Pharmacovigilance Practice modules", "The US Code of Federal Regulations", "WHO Good Manufacturing Practice", "ISO 9001"], "tf": false, "h": "6e7334cf1240c60845936c1a1ea9225ff4f84c63b1ff8ca8fa1a7e640adc2337"}, {"id": "m11q7", "q": "A CRH's QPPV must be available to NAFDAC as a PV contact point:", "o": ["During office hours only", "On a 24-hour basis", "Only during inspections", "Only when a PSUR is due"], "tf": false, "h": "9ab9182d7ed6240c5883a53d195693403b0e69a82acb27de577a20a67e24284f"}, {"id": "m11q8", "q": "When must the PSMF first be submitted to NAFDAC?", "o": ["During application for a Certificate of Registration", "Only when an inspection is announced", "Five years after registration", "Never; it is kept internally"], "tf": false, "h": "053b7176ccd3b1977bcde24117093e82ab37621ce6af2f0555d7507f281cc4c5"}]}, {"title": "ICSR Management in Practice: E2B(R3), Clocks, Follow-up and Quality", "short": "ICSR management in depth", "objectives": ["Apply Day 0 rules and expedited reporting clocks to real cases", "Describe the structure of an ICH E2B(R3) ICSR", "Plan follow-up, literature and partner case handling that will stand up to inspection"], "content": "\n<p>Module 4 and Module 5 introduced where ICSRs come from and how they are validated. This module covers how a company handles them day to day, and what NAFDAC inspectors expect to see.<\/p>\n<p><strong>Day 0 and the clock.<\/strong> The reporting clock starts on <strong>Day 0<\/strong>, the day <em>anyone<\/em> working for or on behalf of the company (including sales representatives, call centres, partners and vendors) first receives the four minimum criteria: an identifiable reporter, an identifiable patient, a suspect product and an adverse event. It does not wait until the case reaches the safety department.<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Case type<\/th><th>Usual expedited timeline<\/th><th>Basis<\/th><\/tr><\/thead><tbody><tr><td>Post-marketing: serious ADR<\/td><td>Within 15 calendar days of Day 0<\/td><td>ICH E2D; EU GVP Module VI, on which the NAFDAC guidelines are based<\/td><\/tr><tr><td>Post-marketing: non-serious ADR<\/td><td>Within 90 calendar days of Day 0 where individual submission is required<\/td><td>EU GVP Module VI; NAFDAC guidelines measure compliance with 15-day and 90-day reporting<\/td><\/tr><tr><td>Clinical trial: fatal or life-threatening SUSAR<\/td><td>Initial report within 7 calendar days, complete report within a further 8 days<\/td><td>ICH E2A<\/td><\/tr><tr><td>Clinical trial: other SUSAR<\/td><td>Within 15 calendar days<\/td><td>ICH E2A<\/td><\/tr><tr><td>Clinical trial in Nigeria: any SAE<\/td><td>NAFDAC notified within 7 calendar days<\/td><td>NAFDAC Clinical Trial Application Guidelines 2024, section 5.3<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Always confirm current timelines in the NAFDAC guideline version you work to, and in your safety data exchange agreements with partners.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Where does Day 0 fall?<\/h4><p>On Friday 6 March a medical representative in Kano hears from a pharmacist that a 52-year-old man was admitted with jaundice after starting the company's antitubercular product. The representative emails the safety inbox on Monday 9 March. Day 0 is <strong>6 March<\/strong>, because the company's representative had all four minimum criteria that day. The case is serious (hospitalisation), so the 15-day report is due by 21 March. This is why field staff training on AE reporting is an inspection topic.<\/p><\/aside>\n<p><strong>Follow-up.<\/strong> Each piece of significant new information (a new event, a change in se
