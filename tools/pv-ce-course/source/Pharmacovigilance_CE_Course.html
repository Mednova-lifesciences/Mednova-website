riousness, an outcome of death, new causality information) restarts the clock as a follow-up report. Follow-up attempts should be targeted, documented and limited to a defined number (often up to three attempts) set in your SOP. Record what was asked, when, and the response.<\/p>\n<p><strong>Literature.<\/strong> Companies must screen medical literature, usually weekly, for reports on their active substances. Day 0 for a literature case is the day the article containing the minimum criteria is first seen by anyone in the company. Include local Nigerian and African journals in the search strategy, because international databases do not index them all.<\/p>\n<p><strong>Partners.<\/strong> Distributors and licence partners collect cases too. A <strong>Safety Data Exchange Agreement (SDEA)<\/strong> sets who reports what, to whom, and how fast. Without one, local cases can sit in a partner's inbox until the regulatory deadline has passed.<\/p>\n<p><strong>The E2B(R3) format.<\/strong> ICSRs are exchanged electronically in the ICH E2B(R3) format. Its main sections are:<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Section<\/th><th>Content<\/th><\/tr><\/thead><tbody><tr><td>C<\/td><td>Administrative information: report identifiers, dates received, report type, primary source (reporter), sender, literature reference, study details<\/td><\/tr><tr><td>D<\/td><td>Patient: age, sex, weight, medical history, concurrent conditions, death details, parent information for parent-child cases<\/td><\/tr><tr><td>E<\/td><td>Reactions and events: reported term, MedDRA coding, onset date, seriousness criteria, outcome<\/td><\/tr><tr><td>F<\/td><td>Tests and procedures relevant to the case<\/td><\/tr><tr><td>G<\/td><td>Drug information: suspect, concomitant and interacting drugs, dose, route, dates, action taken, dechallenge and rechallenge<\/td><\/tr><tr><td>H<\/td><td>Narrative case summary, reporter's comments, sender's diagnosis and sender's comments<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Data entered in structured fields and the narrative in section H must agree. A narrative that says “recovered” while the structured outcome says “not recovered” is a common audit finding.<\/p>\n<p><strong>Quality metrics.<\/strong> Track the percentage of cases submitted on time, the reasons for late cases, the time from receipt to data entry, and the error rate found in quality review. These numbers go in the PSMF annex and are among the first things an inspector asks for.<\/p>\n", "takeaways": ["Day 0 is when anyone acting for the company first has the four minimum criteria.", "Common clocks: 15 days for serious post-marketing ADRs, 90 days for non-serious; 7 + 8 days for fatal or life-threatening SUSARs; NAFDAC wants trial SAEs within 7 days.", "Significant follow-up information restarts the clock.", "SDEAs, literature screening and field staff training stop cases from being late.", "Structured E2B(R3) data and the narrative must match."], "track": "Part 2: PV practice and NAFDAC", "trackBlurb": "Company PV practice in Nigeria: ICSR management, regulatory writing, DSURs, PSURs, RMPs, the PSMF and inspection readiness.", "sources": ["NAFDAC Good Pharmacovigilance Practice Guidelines, Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021", "NAFDAC Guidelines for Clinical Trial Application in Nigeria, Ref. DER-GDL-002-03, effective 19 November 2024", "ICH E2A, E2B(R3) and E2D guidelines", "EU GVP Module VI"], "quiz": [{"id": "m12q1", "q": "A sales representative learns of a serious ADR on Monday but emails safety on Thursday. When is Day 0?", "o": ["Monday", "Thursday", "The day data entry is complete", "The day the case is medically reviewed"], "tf": false, "h": "c2fb68bc7903cdcd7111569c7439b1969b5c489db6807d5fa5f036d5cabf98e6"}, {"id": "m12q2", "q": "Under ICH E2A, a fatal or life-threatening SUSAR in a clinical trial needs an initial report within:", "o": ["24 hours", "7 calendar days", "15 calendar days", "90 calendar days"], "tf": false, "h": "aafd9717efcdc7565c9e3b3e0a45648a62b793c7a5fca3f97e595ce16dcf70c7"}, {"id": "m12q3", "q": "According to NAFDAC's 2024 Clinical Trial Application Guidelines, the Agency should be notified of SAEs within:", "o": ["24 hours", "7 calendar days", "30 calendar days", "The next progress report"], "tf": false, "h": "1be35b317b1a48e27461c5f0e2835559d15113238e27ce5c59ef3bf86288cd6e"}, {"id": "m12q4", "q": "Which E2B(R3) section holds the narrative case summary?", "o": ["Section C", "Section D", "Section G", "Section H"], "tf": false, "h": "d09a6a85e422d9e790a350a44360a526bad28441f215739cfd5a5f89e98990f2"}, {"id": "m12q5", "q": "What does a Safety Data Exchange Agreement define?", "o": ["The product's selling price", "Who collects and reports safety data, to whom and how fast", "The PSUR data lock point", "The QPPV's salary"], "tf": false, "h": "df49fccb2600fba2cf634bf0d066c878be925afc847f23ae47dc1ceb064e53c5"}, {"id": "m12q6", "q": "True or False: Significant follow-up information on a serious case starts a new reporting clock.", "o": ["True", "False"], "tf": true, "h": "b830962d8a2814f3f15b9f78c80882adf21f693b77f064f433070aad65658984"}, {"id": "m12q7", "q": "Why should literature searches for Nigerian products include local and African journals?", "o": ["Local journals are always peer reviewed", "International databases may not index them, so cases could be missed", "NAFDAC only accepts local articles", "It removes the need for weekly screening"], "tf": false, "h": "85a703bc460a4aa94a430cdbe69c836ea6b75fedfe75ddbb18a858828fdd0812"}, {"id": "m12q8", "q": "A narrative says the patient recovered but the structured outcome field says “not recovered.” This is:", "o": ["Acceptable if the narrative is detailed", "A data consistency error that must be corrected", "Required by E2B(R3)", "Only a problem for non-serious cases"], "tf": false, "h": "73fdf00323c14d761cbb9db59526e223d22a34de0c2bbcecf84da6e06784b63d"}]}, {"title": "Pharmacovigilance Writing: Narratives, Assessments and Safety Communications", "short": "PV writing for NAFDAC", "objectives": ["Write clear, complete and objective case narratives and company comments", "Structure a signal assessment report and a response to an Agency query", "Draft a Direct Healthcare Professional Communication (DHPC) suited to Nigerian prescribers"], "content": "\n<p>Most PV work ends up as writing that a regulator reads. Good PV writing is <strong>accurate, traceable, objective and consistent<\/strong>. Every statement should be traceable to a source, every number should add up, and the same fact should be described the same way across the ICSR, the PSUR and the RMP.<\/p>\n<p><strong>Core rules for any PV document.<\/strong><\/p>\n<ul><li>Write what the data show; separate facts from interpretation and label interpretation as such (“In the company's opinion…”).<\/li><li>Use MedDRA preferred terms for events and the international non-proprietary name (INN) for products, with the brand name where relevant.<\/li><li>Give dates as day, month and year, and give units with every value (for example, ALT 245 U/L, normal &lt;40).<\/li><li>State what is unknown (“The outcome is unknown; follow-up has been requested”) rather than leaving gaps.<\/li><li>Keep version control, a document owner, a reviewer and an approval record. Inspectors ask for them.<\/li><li>Include Nigeria-specific data wherever a NAFDAC submission allows it. A national assessment of Nigerian PV found that PSURs sent to NAFDAC often lacked data specific to Nigeria.<\/li><\/ul>\n<p><strong>Case narratives.<\/strong> Follow a fixed order so reviewers always know where to look: (1) reporter and source, (2) patient details and relevant history, (3) suspect product with indication, dose, route and start date, (4) concomitant medicines, (5) the event in time order, with investigations, (6) treatment and action taken with the suspect product, (7) dechallenge and rechallenge, (8) outcome, (9) reporter's causality, (10) company comment.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Company comment: weak and strong<\/h4><p><strong>Weak:<\/strong> “The event is probably caused by the drug. Case is serious.”<\/p><p><strong>Strong:<\/strong> “Hepatotoxicity is a listed adverse reaction in the reference safety information for isoniazid. The temporal relationship (onset 4 weeks after start) and positive dechallenge support a causal role. Concomitant rifampicin and pyrazinamide are confounders. The company assesses the case as serious (hospitalisation), expected and possibly related.”<\/p><\/aside>\n<p><strong>Signal assessment reports.<\/strong> A clear structure is: background and how the signal was detected; data sources and search strategy (with dates and MedDRA terms); case review with a case-level table; literature; mechanism and class effects; exposure and, where possible, observed-versus-expected analysis; discussion; conclusion; and recommended action (for example, update the reference safety information, add to the RMP, or close with no action). State the date of the data search so the analysis can be reproduced.<\/p>\n<p><strong>Responding to an Agency query.<\/strong> Restate each question exactly as NAFDAC asked it, then answer it directly underneath, with data and references. Do not merge questions or answer a different question. Meet the deadline in the request; if you cannot, ask for an extension before it expires and explain why.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Answering a NAFDAC request<\/h4><p>NAFDAC asks a CRH to “provide all Nigerian cases of Stevens-Johnson syndrome with Product Y and discuss whether the patient information leaflet is adequate.” A good response has two numbered sections that match the two parts of the request. Section 1 gives the search date, MedDRA terms used, a line listing of Nigerian cases and a short summary. Section 2 quotes the current leaflet wording, assesses it against the data, and proposes revised wording if needed.<\/p><\/aside>\n<p><strong>Safety communications (DHPCs).<\/strong> A Direct Healthcare Professional Communication alerts prescribers and pharmacists to an important new safety issue. The NAFDAC GVP guidelines include a chapter on safety communication, and the PV/PMS Directorate issues national safety communications, so agree the content and distribution plan with NAFDAC before release. A DHPC should have: a clear subject line naming the product and the risk; a short summary box with the key message and what to do; background on the issue; advice to healthcare professionals; a call to report suspected ADRs, naming the national channels (Yellow Form, the VigiFlow e-reporting form, the Med Safety app) and the company contact; and company contact details. Keep it short enough to read in two minutes.<\/p>\n", "takeaways": ["PV writing must be accurate, traceable, objective and consistent across documents.", "Use a fixed narrative order and a reasoned company comment.", "Answer Agency queries question by question, on time.", "Agree DHPCs with NAFDAC before release and always tell readers how to report ADRs in Nigeria.", "Put Nigeria-specific data in NAFDAC submissions."], "track": "Part 2: PV practice and NAFDAC", "trackBlurb": "Company PV practice in Nigeria: ICSR management, regulatory writing, DSURs, PSURs, RMPs, the PSMF and inspection readiness.", "sources": ["NAFDAC Good Pharmacovigilance Practice Guidelines, Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021", "ICH E2B(R3) and E2C(R2)", "PAVIA baseline assessment of pharmacovigilance in Nigeria (2023)"], "quiz": [{"id": "m13q1", "q": "Which statement belongs in a company comment rather than in the factual narrative?", "o": ["The patient was admitted on 4 May 2026", "ALT was 245 U/L", "The company assesses the case as possibly related", "The patient is a 34-year-old woman"], "tf": false, "h": "5b82a64de422ce5fa2730129549cffe90b3be684118e5d472dc3b54f2a10d8e2"}, {"id": "m13q2", "q": "Which terminology should be used to name adverse events in PV documents?", "o": ["The reporter's words only", "MedDRA preferred terms", "Local slang to aid understanding", "The brand name of the product"], "tf": false, "h": "24e50101436f6caf39506bdc50ec9e5b95090730153453b05787b350544fbf97"}, {"id": "m13q3", "q": "When a value is unknown in a narrative, the writer should:", "o": ["Estimate it", "Leave the sentence out", "State that it is unknown and whether follow-up was requested", "Copy the value from a similar case"], "tf": false, "h": "fa19225e5d15dde62755a75545982aa93f04f109e9d2e83e1aec219057cb7313"}, {"id": "m13q4", "q": "What is the best way to structure a response to a two-part NAFDAC request?", "o": ["One combined essay", "Two numbered sections matching each part of the request", "A copy of the latest PSUR", "A covering letter only"], "tf": false, "h": "c86b7bac5a64c1ec2999b60fc8b9a3db4b58e11de30d732f0ead0c9d98271fa2"}, {"id": "m13q5", "q": "A national assessment found that PSURs submitted to NAFDAC often lacked:", "o": ["A title page", "Nigeria-specific data", "MedDRA coding", "An executive summary"], "tf": false, "h": "6e4291c242ad9983b7aacbad6d04ac51d21d59866193ecac659c48c576fdff5f"}, {"id": "m13q6", "q": "True or False: A signal assessment report should state the date of the data search so the analysis can be reproduced.", "o": ["True", "False"], "tf": true, "h": "d4a9bd768c46189f2f91a52308e7285a94c349d0634b9fa52f49cf8ef64badf9"}, {"id": "m13q7", "q": "Which element must every DHPC for Nigerian healthcare professionals include?", "o": ["The product's price", "A call to report suspected ADRs through national channels", "Sales targets", "The QPPV's home address"], "tf": false, "h": "99c929ce1fc9bc050a982ea10aab2788795ef41b3b204f51ef933f913f1351a6"}, {"id": "m13q8", "q": "If a CRH cannot meet a NAFDAC response deadline, it should:", "o": ["Submit late without comment", "Ask for an extension before the deadline and explain why", "Ignore the request", "Answer a different question"], "tf": false, "h": "7e1c2977d3e24abbba47ffec15b416bb42d2c16793bfe62660b2e6cf29069a12"}]}, {"title": "Development Safety Update Reports (DSURs) and Clinical Trial Safety in Nigeria", "short": "DSUR writing", "objectives": ["Explain the purpose, timing and scope of a DSUR under ICH E2F", "Describe the main sections of a DSUR and what goes in each", "Link DSUR writing to NAFDAC clinical trial safety reporting duties"], "content": "\n<p>A <strong>Development Safety Update Report (DSUR)<\/strong> is the annual safety report for a medicine under clinical investigation, defined in <strong>ICH E2F<\/strong>. Its aim is a yearly, comprehensive review of safety information from all trials of the investigational product, so that the sponsor and regulators can judge whether the risks to participants are still acceptable.<\/p>\n<p><strong>Timing.<\/strong><\/p>\n<ul><li>The reporting period is one year, starting from the <strong>Development International Birth Date (DIBD)<\/strong>: the date of the sponsor's first authorisation to run an interventional trial anywhere in the world.<\/li><li>The <strong>data lock point (DLP)<\/strong> is the last day of the one-year period.<\/li><li>The DSUR is submitted within <strong>60 calendar days<\/strong> of the DLP.<\/li><li>One DSUR covers the active substance across all indications, dosage forms and trials run by the sponsor.<\/li><\/ul>\n<p><strong>Nigerian context.<\/strong> Expedited safety reports do not wait for the DSUR. NAFDAC's Clinical Trial Application Guidelines (2024) require the Agency to be notified of serious adverse events within seven calendar days and require progress reports during the trial and a final report at the end. The NAFDAC GCP Guidelines (2025) require investigators to report SAEs to the sponsor immediately and to report SUSARs to the ethics committee in line with regulatory requirements. Confirm with NAFDAC's Drug Evaluation and Research Directorate whether a DSUR or another annual safety report format is expected for your trial, and record the agreed approach in the trial master file.<\/p>\n<p><strong>Structure (ICH E2F).<\/strong><\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Section<\/th><th>What goes in it<\/th><\/tr><\/thead><tbody><tr><td>Title page and executive summary<\/td><td>Product, reporting period, DLP, sponsor; a concise summary of new safety findings and conclusions<\/td><\/tr><tr><td>1–4<\/td><td>Introduction; worldwide marketing approval status; actions taken for safety reasons in the period; changes to the reference safety information (usually the Investigator's Brochure)<\/td><\/tr><tr><td>5–6<\/td><td>Inventory of ongoing and completed trials; estimated cumulative exposure in trials and, if marketed, after approval<\/td><\/tr><tr><td>7<\/td><td>Line listings of serious adverse reactions in the period and cumulative summary tabulations of serious adverse events<\/td><\/tr><tr><td>8–13<\/td><td>Significant findings from clinical trials, non-interventional studies, other studies, marketing experience, non-clinical data and literature<\/td><\/tr><tr><td>14–17<\/td><td>Other DSURs; lack of efficacy; region-specific information; late-breaking information after the DLP<\/td><\/tr><tr><td>18<\/td><td>Overall safety assessment: evaluation of risks and benefit-risk considerations<\/td><\/tr><tr><td>19<\/td><td>Summary of important risks: a cumulative list of important identified and potential risks<\/td><\/tr><tr><td>20<\/td><td>Conclusions, including any changes to the development programme<\/td><\/tr><\/tbody><\/table><\/div>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Writing the overall safety assessment<\/h4><p>A DSUR for an investigational antimalarial covers 2,400 participants across four trials, including 300 in a Nigerian Phase III site network. Three cases of QT prolongation were reported in the period, all at the highest dose. A good section 18 sets these against cumulative data (two earlier cases), notes that ECG monitoring was already in the protocol, describes the dose-response pattern, and concludes that QT prolongation is upgraded from potential to identified risk. It then states the action: the Investigator's Brochure is updated, the top dose arm is closed, and ECG monitoring frequency is increased.<\/p><\/aside>\n<p><strong>Tips for DSUR writers.<\/strong> Start from the previous DSUR's summary of important risks and update it. Make sure the numbers in the line listings, tabulations and text match. Explain every change to the reference safety information. Keep the executive summary to what a busy assessor needs: what is new, what it means, and what the sponsor is doing.<\/p>\n", "takeaways": ["DSUR = annual safety review of an investigational product (ICH E2F).", "Period starts from the DIBD; submit within 60 days of the DLP.", "Expedited reports (SUSARs, and SAEs to NAFDAC within 7 days) are separate from the DSUR.", "Section 18 (overall safety assessment) and section 19 (important risks) carry the most weight."], "track": "Part 2: PV practice and NAFDAC", "trackBlurb": "Company PV practice in Nigeria: ICSR management, regulatory writing, DSURs, PSURs, RMPs, the PSMF and inspection readiness.", "sources": ["ICH E2F Development Safety Update Report", "NAFDAC Guidelines for Clinical Trial Application in Nigeria, Ref. DER-GDL-002-03, effective 19 November 2024", "NAFDAC Good Clinical Practice Guidelines 2025, Ref. DER-GDL-020-03, effective 5 May 2025"], "quiz": [{"id": "m14q1", "q": "Which ICH guideline defines the DSUR?", "o": ["ICH E2A", "ICH E2C(R2)", "ICH E2F", "ICH E6"], "tf": false, "h": "bcde785d7affacdb57db83f6f6a80d44c827ce1bb03cfe9f94e4d6a702e2b3cc"}, {"id": "m14q2", "q": "The DSUR reporting period is based on the:", "o": ["International Birth Date of the marketed product", "Development International Birth Date (DIBD)", "Date of the first NAFDAC inspection", "Calendar year only"], "tf": false, "h": "314fef5247458a4a0da6dac55bad95f39de72a17a9df29a1769645c93bcc2f9d"}, {"id": "m14q3", "q": "How soon after the data lock point is a DSUR due?", "o": ["15 days", "30 days", "60 days", "6 months"], "tf": false, "h": "a1dac04a262708a61318f5b86ffa1b6bec05b7cf9f03e9f4fdef76c407be972e"}, {"id": "m14q4", "q": "The reference safety information for most investigational products is the:", "o": ["Patient information leaflet", "Investigator's Brochure", "PSMF", "Marketing brochure"], "tf": false, "h": "ec15cdb74c962290c792ab93c540738724fb36191e8732bcdda55bffc8092c85"}, {"id": "m14q5", "q": "True or False: SAEs in a Nigerian trial can wait for the next DSUR rather than being notified to NAFDAC.", "o": ["True", "False"], "tf": true, "h": "45f948c26f9cd293c12622db27ca37d5f67beb39b9de29e58606ab30d85ad8d5"}, {"id": "m14q6", "q": "Which DSUR section holds the cumulative list of important identified and potential risks?", "o": ["Executive summary", "Inventory of clinical trials", "Summary of important risks", "Late-breaking information"], "tf": false, "h": "62899bf0d8ca6c6b7fba2e0cd53ce3d072687d2163504adf75cedc4c60dc7e17"}, {"id": "m14q7", "q": "One DSUR generally covers:", "o": ["One trial site", "One indication only", "The active substance across all the sponsor's trials", "Only Nigerian participants"], "tf": false, "h": "a6fb607e8452929239b6a5f12a9fb51d11c2ff2f71bcef1a046cca632ead1081"}, {"id": "m14q8", "q": "Information received after the DLP but important enough to include goes in:", "o": ["Late-breaking information", "Title page", "Worldwide marketing approval status", "It cannot be included"], "tf": false, "h": "50b91509a602f0a1198362388a009f19e9b677f02ef1da62ed32b14af0c6e7e3"}]}, {"title": "PSUR/PBRER Writing: Periodic Benefit-Risk Evaluation", "short": "PSUR/PBRER writing", "objectives": ["Explain the purpose, periodicity and timing of a PSUR/PBRER", "Describe the ICH E2C(R2) PBRER sections and how they connect", "Write a sound integrated benefit-risk evaluation that includes Nigerian data"], "content": "\n<p>The <strong>Periodic Benefit-Risk Evaluation Report (PBRER)<\/strong>, defined in <strong>ICH E2C(R2)<\/strong>, replaced the older PSUR format. Many regulators, including NAFDAC in its GVP guidelines, still use the name PSUR. Its purpose is not to list every case: it is a <strong>cumulative evaluation of the benefit-risk balance<\/strong> of a marketed product, taking account of new information in the reporting period.<\/p>\n<p><strong>Key dates.<\/strong><\/p>\n<ul><li><strong>International Birth Date (IBD):<\/strong> the date of the first marketing approval anywhere in the world. Reporting periods follow the IBD.<\/li><li><strong>Data lock point (DLP):<\/strong> the cut-off for data included in the report.<\/li><li><strong>Periodicity:<\/strong> under EU GVP, which NAFDAC's guidelines follow, a common default for new products is 6-monthly for the first two years after approval, annually for the next two years, then every three years. NAFDAC may set a different schedule for a product, and the PSMF annex must list any non-standard periodicity.<\/li><li><strong>Submission:<\/strong> under EU GVP, within 70 calendar days of the DLP for reports covering up to 12 months, and within 90 days for longer intervals. Confirm NAFDAC's current requirement for your product.<\/li><\/ul>\n<p><strong>Structure (ICH E2C(R2)).<\/strong><\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Section<\/th><th>Content<\/th><\/tr><\/thead><tbody><tr><td>1–4<\/td><td>Introduction; worldwide marketing approval status; actions taken for safety reasons; changes to the reference safety information<\/td><\/tr><tr><td>5<\/td><td>Estimated exposure and use patterns: clinical trial exposure and post-marketing patient exposure<\/td><\/tr><tr><td>6<\/td><td>Data in summary tabulations: cumulative serious adverse events from trials, and cumulative and interval post-marketing data<\/td><\/tr><tr><td>7–12<\/td><td>Findings from clinical trials, non-interventional studies, other sources, non-clinical data, literature and other periodic reports<\/td><\/tr><tr><td>13–14<\/td><td>Lack of efficacy in controlled trials; late-breaking information<\/td><\/tr><tr><td>15<\/td><td>Overview of signals: new, ongoing or closed in the period<\/td><\/tr><tr><td>16<\/td><td>Signal and risk evaluation: summary of safety concerns, signal evaluations, evaluation of risks, characterisation of important risks, effectiveness of risk minimisation<\/td><\/tr><tr><td>17<\/td><td>Benefit evaluation: baseline efficacy and effectiveness, and new information<\/td><\/tr><tr><td>18<\/td><td>Integrated benefit-risk analysis for approved indications<\/td><\/tr><tr><td>19<\/td><td>Conclusions and actions<\/td><\/tr><tr><td>20<\/td><td>Appendices<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Making it work for NAFDAC.<\/strong> Most PBRERs are written once at global level. For Nigeria, check that the report shows the product's Nigerian registration status, Nigerian exposure estimates (for example, from sales volumes), a summary of Nigerian cases, and any local safety actions or NAFDAC requests. Where the global report cannot hold this, add a short regional appendix or cover letter. The PAVIA assessment of Nigerian PV specifically noted that PSURs submitted to NAFDAC often lacked Nigeria-specific data.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Estimating Nigerian exposure<\/h4><p>A company sold 1.2 million tablets of an antihypertensive in Nigeria during a 12-month period. The defined daily dose is one tablet. Exposure ≈ 1,200,000 ÷ 365 ≈ 3,290 patient-years. State the method, the source of the sales data and its limits (for example, stock held by wholesalers) so the estimate can be checked.<\/p><\/aside>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>A sound integrated benefit-risk conclusion<\/h4><p>“During the reporting period, angioedema was confirmed as an identified risk (section 16). Its reporting rate remains low (approximately 1 per 10,000 patient-years) and it is manageable with prompt withdrawal and treatment. The benefit in reducing blood pressure and cardiovascular events is unchanged (section 17). The benefit-risk balance in the approved indication remains positive. The company proposes to update the SmPC and leaflet and to add angioedema to the RMP as an important identified risk.”<\/p><\/aside>\n<p><strong>Common weaknesses.<\/strong> Sections that contradict each other; signals mentioned in section 15 but never evaluated in section 16; exposure with no stated method; conclusions with no action; and copying the previous report's text without updating it.<\/p>\n", "takeaways": ["PBRER (ICH E2C(R2)) is a cumulative benefit-risk evaluation; NAFDAC still uses the term PSUR.", "Periods follow the IBD; EU GVP submission is 70 days (≤12-month reports) or 90 days (longer).", "Sections 15–19 are the analytical core: signals, risks, benefits, integrated benefit-risk, conclusions.", "Add Nigerian exposure, cases and actions for NAFDAC submissions."], "track": "Part 2: PV practice and NAFDAC", "trackBlurb": "Company PV practice in Nigeria: ICSR management, regulatory writing, DSURs, PSURs, RMPs, the PSMF and inspection readiness.", "sources": ["NAFDAC Good Pharmacovigilance Practice Guidelines, Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021", "ICH E2C(R2) Periodic Benefit-Risk Evaluation Report", "EU GVP Module VII", "PAVIA baseline assessment of pharmacovigilance in Nigeria (2023)"], "quiz": [{"id": "m15q1", "q": "The PBRER format is defined in:", "o": ["ICH E2B(R3)", "ICH E2C(R2)", "ICH E2F", "ICH M4"], "tf": false, "h": "2960efdc95f4480bda269d9f33213176b5b462e49f4db3187895a26f540c8ec7"}, {"id": "m15q2", "q": "PSUR reporting periods are based on the:", "o": ["International Birth Date (IBD)", "Development International Birth Date", "Date the QPPV was appointed", "NAFDAC registration renewal date"], "tf": false, "h": "bb0bc05a9d7322b9d61574b37ce3f782949aa6ff1dca5134715e8404ca40e497"}, {"id": "m15q3", "q": "Under EU GVP, a PSUR covering up to 12 months is due within how many days of the DLP?", "o": ["15", "60", "70", "120"], "tf": false, "h": "a3ad73b5099e7775e0fc67892aaf25f9806b5286c00bb1ea48b6163e941dbf8c"}, {"id": "m15q4", "q": "Which PBRER section brings benefits and risks together into one conclusion?", "o": ["Section 5: exposure", "Section 6: summary tabulations", "Section 15: overview of signals", "Section 18: integrated benefit-risk analysis"], "tf": false, "h": "91ab911e8d4a6165fc4d7e1e2d8a15c0013f37dae50889512ff9b70a9f4a7275"}, {"id": "m15q5", "q": "True or False: A PBRER's main purpose is to list every individual case report received.", "o": ["True", "False"], "tf": true, "h": "1a1b3eb87040c2394d08373db98e1753b8d26a8edc3e524c4c9a475343f2cab2"}, {"id": "m15q6", "q": "A signal listed in section 15 should then be:", "o": ["Ignored until the next report", "Evaluated in section 16", "Moved to the appendix only", "Deleted from the database"], "tf": false, "h": "6b0e5dc255129948416e2e7c8822134cc0baf50ac170db6b7a87b5e9e8bee42a"}, {"id": "m15q7", "q": "How can a CRH estimate Nigerian patient exposure for a PSUR?", "o": ["From Nigerian sales volumes and the defined daily dose, with the method stated", "By counting ADR reports", "From the number of pharmacies in Nigeria", "It cannot be estimated"], "tf": false, "h": "13dd8187de76a2fcdcde18373f6e0bd9c605fc8f1afdcfa2b9de14601d74a7f2"}, {"id": "m15q8", "q": "Which is a common weakness in PSURs?", "o": ["Stating the exposure method", "Conclusions with no proposed action", "Including Nigerian data", "Updating the reference safety information section"], "tf": false, "h": "91c97c3dc3dfd80f64361055e79e098dbac45fe15ea91679664613f51f1506e8"}]}, {"title": "Writing Risk Management Plans and the Pharmacovigilance System Master File", "short": "RMP and PSMF writing", "objectives": ["Describe the parts of an RMP and write a clear safety specification", "Choose between routine and additional risk minimisation measures", "Describe the content of a NAFDAC PSMF and how to keep it current"], "content": "\n<p><strong>The RMP.<\/strong> Module 10 introduced the RMP. The NAFDAC GVP guidelines describe it as a dynamic, stand-alone document, updated through the product's life, with the CRH responsible for its content and accuracy. NAFDAC's RMP format follows the EU structure of seven parts:<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Part<\/th><th>Content<\/th><\/tr><\/thead><tbody><tr><td>I<\/td><td>Product overview<\/td><\/tr><tr><td>II<\/td><td>Safety specification: epidemiology of the indication, non-clinical and clinical findings, populations not studied, post-authorisation experience, and the summary of safety concerns<\/td><\/tr><tr><td>III<\/td><td>Pharmacovigilance plan: routine PV plus any additional studies or activities<\/td><\/tr><tr><td>IV<\/td><td>Plans for post-authorisation efficacy studies<\/td><\/tr><tr><td>V<\/td><td>Risk minimisation measures, including an evaluation of their effectiveness<\/td><\/tr><tr><td>VI<\/td><td>Summary of the RMP<\/td><\/tr><tr><td>VII<\/td><td>Annexes<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>The safety specification<\/strong> ends in a <strong>summary of safety concerns<\/strong> with three categories: <em>important identified risks<\/em> (adequate evidence of a link), <em>important potential risks<\/em> (some basis for suspicion, not confirmed), and <em>missing information<\/em> (gaps such as use in pregnancy, children or patients with liver disease). For Nigeria, think about local epidemiology: high background rates of malaria, HIV, tuberculosis and sickle cell disease, common use of herbal products, and the risk of substandard and falsified products in the supply chain.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Choosing a risk minimisation measure<\/h4><p>A new oral anticoagulant has an important identified risk of major bleeding. <strong>Routine<\/strong> measures are the SmPC, the patient leaflet, pack size and legal status (prescription only). The team considers adding a patient alert card and a prescriber guide as <strong>additional<\/strong> measures, because many patients in Nigeria also use herbal remedies that may interact. The RMP states how effectiveness will be measured: a survey of prescriber knowledge at 12 months and monitoring of bleeding reports.<\/p><\/aside>\n<p><strong>The PSMF.<\/strong> The Pharmacovigilance System Master File describes the company's PV system. Under the NAFDAC GVP guidelines it must be located at a site in Nigeria, be continuously accessible to the QPPV and to NAFDAC, and be submitted when applying for a Certificate of Registration. A typical PSMF covers:<\/p>\n<ul><li>the QPPV: responsibilities, CV, contact details and back-up arrangements<\/li><li>the organisational structure of the CRH and of partners and contractors involved in PV<\/li><li>sources of safety data and the case flow from receipt to submission<\/li><li>computerised systems and databases, including validation status<\/li><li>PV processes and the list of SOPs<\/li><li>performance of the PV system, including compliance with 15-day and 90-day reporting and PSUR timeliness<\/li><li>the quality system: document control, training, audits (a list of audits completed over the past five years) and CAPA<\/li><li>annexes, including the list of products, contracts and agreements, and a <strong>logbook<\/strong> of changes<\/li><\/ul>\n<p>Every change (a new QPPV, a new partner, a new safety database) must be logged and the QPPV informed. An out-of-date PSMF is a common inspection finding because it suggests the company does not know how its own system works.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Keeping the PSMF alive<\/h4><p>A CRH switches its local distributor in Lagos. The PV lead updates the PSMF section on partners, adds the new SDEA to the contracts annex, records the change in the logbook with the date and reason, retrains the distributor's staff on AE reporting, and tells the QPPV. When NAFDAC inspects six months later, the PSMF matches what inspectors find on site.<\/p><\/aside>\n", "takeaways": ["RMP: seven parts; the safety specification ends in identified risks, potential risks and missing information.", "Routine measures are the label and legal status; additional measures (cards, guides, controlled access) need an effectiveness check.", "The NAFDAC PSMF sits in Nigeria, is open to the QPPV and NAFDAC, and is submitted at registration.", "Log every PSMF change and keep it current."], "track": "Part 2: PV practice and NAFDAC", "trackBlurb": "Company PV practice in Nigeria: ICSR management, regulatory writing, DSURs, PSURs, RMPs, the PSMF and inspection readiness.", "sources": ["NAFDAC Good Pharmacovigilance Practice Guidelines, Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021", "EU GVP Modules II and V"], "quiz": [{"id": "m16q1", "q": "How many parts does the RMP format described in the NAFDAC guidelines have?", "o": ["Three", "Five", "Seven", "Twelve"], "tf": false, "h": "52d6a1f2d5e0095681827f4cb687a3f8ea97dccf121853ebc0cbd00a346ba47b"}, {"id": "m16q2", "q": "Use of a new medicine in pregnancy that was never studied is recorded in the summary of safety concerns as:", "o": ["An important identified risk", "Missing information", "A routine measure", "A closed signal"], "tf": false, "h": "655f6d9a8658ead29035291b5ca856b4beb6731ff12fca6f869c3537225bb1fd"}, {"id": "m16q3", "q": "Which of these is an additional risk minimisation measure?", "o": ["The SmPC", "The patient leaflet", "A patient alert card", "Prescription-only legal status"], "tf": false, "h": "f7cb0de032f65cb76ca8ae4e8ed668828a1c7988b4cbfbf7719853196447fc85"}, {"id": "m16q4", "q": "Where must a NAFDAC PSMF be located?", "o": ["At a site in Nigeria", "At the global headquarters only", "With the distributor", "In the safety database"], "tf": false, "h": "8aa560ebfc54657ff06e69b8067d4dc91d33827dca49b0e52d721d6f15c33aa1"}, {"id": "m16q5", "q": "True or False: Additional risk minimisation measures should include a plan to measure their effectiveness.", "o": ["True", "False"], "tf": true, "h": "3a1fc52e06db492e1790811619a3633e252bd5cbf7db5a05232bca0e9bd44665"}, {"id": "m16q6", "q": "A change of distributor should lead to which PSMF action?", "o": ["No action until the next inspection", "Update the relevant sections and record the change in the logbook", "Delete the old PSMF and start again", "Notify only the sales team"], "tf": false, "h": "ba0c3261c1f36db2abf8d9ebbc56d6b8783bccf5e3b920631eb3623eed38f21a"}, {"id": "m16q7", "q": "Which PSMF content shows how well the PV system is performing?", "o": ["The company's marketing plan", "Compliance with 15-day and 90-day reporting and PSUR timeliness", "The product price list", "Staff holiday rota"], "tf": false, "h": "105c3c841f5cf6731b4da9f7ab18c20277f92deaf2a8d740ed350263c9fe7e95"}, {"id": "m16q8", "q": "Which local factor is most relevant when writing a safety specification for Nigeria?", "o": ["Exchange rates", "Common use of herbal products and high background rates of malaria and HIV", "The number of airports", "Advertising regulations"], "tf": false, "h": "182217c02c72d5dc4407fd6eb6aabdbf271479b5afe3f992e48459522193d762"}]}, {"title": "PV Audit and Inspection Readiness", "short": "Audit and inspection readiness", "objectives": ["Describe the types of PV inspection and how findings are graded", "Plan an audit programme and a mock inspection", "Run an inspection day and write effective CAPAs"], "content": "\n<p>The NAFDAC PV/PMS Directorate carries out pharmacovigilance inspections, and the NAFDAC GVP guidelines state that products may be inspected at the Agency's discretion. They also require CRHs to run a risk-based audit programme, report audit results to management, and take corrective and preventive action. Being ready is not a project before an inspection; it is how the system runs every day.<\/p>\n<p><strong>Types of inspection.<\/strong> These categories are used by regulators that follow EU GVP:<\/p>\n<div class=\"tbl first-col\"><table><thead><tr><th>Type<\/th><th>What it means<\/th><\/tr><\/thead><tbody><tr><td>Routine (system) inspection<\/td><td>A planned review of the whole PV system, usually announced in advance<\/td><\/tr><tr><td>For-cause inspection<\/td><td>Triggered by a concern, such as late reports, a safety issue that was not acted on, or information from another regulator<\/td><\/tr><tr><td>Pre-authorisation inspection<\/td><td>Checks that the PV system described in an application exists and works before approval<\/td><\/tr><tr><td>Product-specific inspection<\/td><td>Focuses on one product, for example one with a complex RMP<\/td><\/tr><tr><td>Re-inspection<\/td><td>Follows up earlier findings to check that CAPAs worked<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Grading findings.<\/strong> Regulators that follow EU GVP grade findings as:<\/p>\n<ul><li><strong>Critical:<\/strong> a deficiency that adversely affects patients' rights, safety or well-being, or poses a potential risk to public health, or a serious breach of legal requirements<\/li><li><strong>Major:<\/strong> a deficiency that could affect patients' rights, safety or well-being, or could pose a risk to public health, or a breach of legal requirements<\/li><li><strong>Minor:<\/strong> a deficiency that is not expected to affect patients' rights, safety or well-being<\/li><\/ul>\n<p>Check NAFDAC's current inspection procedure for its own grading terms and deadlines for submitting a CAPA plan.<\/p>\n<p><strong>Audits.<\/strong> An audit programme should be risk-based: audit the areas most likely to fail or with the most impact first (case processing, partners and distributors, literature screening, the safety database, the QPPV function). Keep audit reports, management responses and CAPAs, and list completed audits in the PSMF annex.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>Common findings in PV inspections<\/h4><ul><li>Cases from sales staff or distributors reported late because Day 0 was not understood<\/li><li>No SDEA with a local distributor, or an SDEA without timelines<\/li><li>Literature screening without a defined search strategy or records<\/li><li>PSMF out of date (wrong QPPV, missing partners)<\/li><li>Signals detected but not documented or followed through<\/li><li>Training records missing for staff who handle safety information<\/li><li>CAPAs closed without checking that they worked<\/li><\/ul><\/aside>\n<p><strong>Readiness checklist.<\/strong><\/p>\n<ul><li>The PSMF is current and matches reality.<\/li><li>SOPs are approved, in date, and staff are trained on them, with records.<\/li><li>Compliance metrics (ICSR timeliness, PSUR timeliness, follow-up) are tracked monthly with trend analysis and reasons for late cases.<\/li><li>SDEAs exist for every partner that may receive safety information.<\/li><li>The safety database is validated and access is controlled.<\/li><li>The QPPV and deputy can explain the system and show oversight (meeting minutes, metrics reviews).<\/li><li>Open CAPAs are on track; closed CAPAs have an effectiveness check.<\/li><li>A mock inspection has been run within the last year.<\/li><\/ul>\n<p><strong>On the day.<\/strong> Set up a <em>front room<\/em> where inspectors work with a host and a scribe, and a <em>back room<\/em> where a team retrieves documents and checks them before they are handed over. Keep a log of every request and every document provided. Prepare short presentations (for example, a 20-minute overview of the PV system and case flow). Coach staff to answer the question asked, honestly, and to say “I will find out” rather than guess.<\/p>\n<p><strong>Writing a CAPA.<\/strong> A strong CAPA has a clear <em>root cause<\/em> (use a method such as the 5 Whys), a <em>correction<\/em> for the immediate problem, a <em>corrective action<\/em> that removes the cause, a <em>preventive action<\/em> that stops it happening elsewhere, an owner, a due date, and an <em>effectiveness check<\/em>.<\/p>\n<aside class=\"case\"><div class=\"case-label\">Example<\/div><h4>From finding to CAPA<\/h4><p><strong>Finding (major):<\/strong> 18% of serious cases from distributors were submitted after 15 days.<\/p><p><strong>Root cause (5 Whys):<\/strong> Distributor staff forwarded cases weekly in a batch, because the SDEA set no timeline and they had never been trained.<\/p><p><strong>Correction:<\/strong> Submit all outstanding late cases with a late-submission explanation.<\/p><p><strong>Corrective action:<\/strong> Amend the SDEA to require forwarding within one business day; train distributor staff.<\/p><p><strong>Preventive action:<\/strong> Review every other partner SDEA for timelines; add partner timeliness to monthly metrics.<\/p><p><strong>Effectiveness check:<\/strong> Over the next six months, partner cases meet the timeline at least 95% of the time.<\/p><\/aside>\n", "takeaways": ["Inspections may be routine, for-cause, pre-authorisation, product-specific or re-inspections.", "Findings are graded critical, major or minor according to their effect on patients and the law.", "Run a risk-based audit programme and a yearly mock inspection.", "On the day: front room, back room, request log, honest answers.", "CAPA = root cause, correction, corrective action, preventive action, owner, date, effectiveness check."], "track": "Part 2: PV practice and NAFDAC", "trackBlurb": "Company PV practice in Nigeria: ICSR management, regulatory writing, DSURs, PSURs, RMPs, the PSMF and inspection readiness.", "sources": ["NAFDAC Good Pharmacovigilance Practice Guidelines, Doc. Ref. PV/PMS-GDL-017-01, effective 21 January 2021", "NAFDAC PV/PMS Directorate web pages", "EU GVP Modules III (inspections) and IV (audits)"], "quiz": [{"id": "m17q1", "q": "An inspection triggered by repeated late ICSR submissions is a:", "o": ["Routine inspection", "For-cause inspection", "Pre-authorisation inspection", "Re-inspection"], "tf": false, "h": "75c5ff1ef18675b85714021c27c00cfc9a4e7e8cdb197a13b9258fdfecdbe3b3"}, {"id": "m17q2", "q": "A deficiency that adversely affects patient safety or poses a potential risk to public health is graded:", "o": ["Minor", "Major", "Critical", "Observation only"], "tf": false, "h": "fa22675fa5e028fc23e3e73daea6ea622f04832b1caa332e4005ef133fd54934"}, {"id": "m17q3", "q": "A risk-based audit programme should audit first:", "o": ["The areas most likely to fail or with the greatest impact", "Areas in alphabetical order", "Only the finance department", "Whatever was audited last year"], "tf": false, "h": "1da2f1fd39fcf3d7304d433fb55f8098d624c2226424149e576484b02d1b740b"}, {"id": "m17q4", "q": "During an inspection, what is the back room for?", "o": ["Hosting the inspectors", "Retrieving and checking documents before they are handed over", "Storing obsolete SOPs", "Hiding late cases"], "tf": false, "h": "bca26ee650a7314cfa8e40775926e364a245891b21ec17e934032eb00eeb7473"}, {"id": "m17q5", "q": "If an inspector asks a question a staff member cannot answer, they should:", "o": ["Guess", "Say they will find out and follow up", "Change the subject", "Refer to a competitor's practice"], "tf": false, "h": "2105d75b14259462d43267bd4fe5483e4f94d8cf72e54ce07464a48cd011eb30"}, {"id": "m17q6", "q": "True or False: A CAPA can be closed once the action is done, without checking whether it worked.", "o": ["True", "False"], "tf": true, "h": "2cc8cc5efb17f613c686ed96c1fb97a63e52c54e06b043790fa4c8dbd27f0e8e"}, {"id": "m17q7", "q": "Which method helps find a root cause?", "o": ["The 5 Whys", "Disproportionality analysis", "MedDRA coding", "Exposure estimation"], "tf": false, "h": "90990dcb04b6106b8e761abb9d0f78a012a350228739919f08ffc0995bf32420"}, {"id": "m17q8", "q": "Which of these is a common PV inspection finding?", "o": ["SDEA with clear timelines", "PSMF matches reality", "No SDEA with a local distributor", "Validated safety database"], "tf": false, "h": "681ecbec3158107737cbff1813be516c285336306dfe729094fb16f3c0149d00"}]}], "final": {"passMark": 80, "quiz": [{"id": "fq1", "q": "A severe headache that does not require hospitalisation and is not medically significant is best classified as:", "o": ["Serious", "Severe but not serious", "A signal", "A special situation"], "tf": false, "h": "d427f92230632d623a6ee8fe8f7b645448a302bd3d580c038444ecd26b6966b5"}, {"id": "fq2", "q": "Which is NOT one of the four minimum criteria for a valid ICSR?", "o": ["Identifiable reporter", "Identifiable patient", "Suspect product", "Completed causality assessment"], "tf": false, "h": "42321023727562e458c25faa2f7ea4224fa410ec5c60a24445ca70f2c370f050"}, {"id": "fq3", "q": "A patient on a company support programme mentions a seizure when called by a coordinator. This report is:", "o": ["Spontaneous", "Solicited", "Literature", "Legal"], "tf": false, "h": "505b1ac368511cb8e82914dcaf56ca3e44391fb64a4538a6915a3969843befe6"}, {"id": "fq4", "q": "A pharmacist reports that an antimalarial from one batch failed to clear fever in several patients. This is a special situation called:", "o": ["Off-label use", "Lack of efficacy", "Occupational exposure", "Overdose"], "tf": false, "h": "451f97c4d115bfb1bf3cb8206b42e4293b54c279250f041c183512e05247976c"}, {"id": "fq5", "q": "A cluster of abscesses after vaccination from one wrongly stored multi-dose vial is most likely a:", "o": ["Vaccine product reaction", "Coincidental event", "Programmatic (immunization) error", "Anxiety-related reaction"], "tf": false, "h": "fc907e43c0feb51baa8cd36befaa76ebb5554646bcd17dd77b59f6da6cf53196"}, {"id": "fq6", "q": "A sales representative hears of a serious ADR on 2 June and tells safety on 5 June. When is the 15-day report due?", "o": ["17 June", "20 June", "2 July", "5 July"], "tf": false, "h": "5c45d44c480e045fd5477cd203dacfa6a42fc4789094e115625e1116d7595659"}, {"id": "fq7", "q": "Under ICH E2A, the complete report for a fatal SUSAR follows the 7-day initial report within a further:", "o": ["24 hours", "8 days", "15 days", "30 days"], "tf": false, "h": "337160746ae6f159f8b77a7575b15c52300165e6653e10b5400b4374e791287f"}, {"id": "fq8", "q": "Where must a NAFDAC CRH's QPPV reside and operate?", "o": ["In Nigeria", "In the EU", "At the global headquarters", "Anywhere with internet access"], "tf": false, "h": "b28a1c2eaacce1724dbb97f297746aea3e946391bd446417ff1e630c75219c0e"}, {"id": "fq9", "q": "NAFDAC's 2024 Clinical Trial Application Guidelines require SAEs to be notified to the Agency within:", "o": ["24 hours", "7 calendar days", "15 calendar days", "With the DSUR"], "tf": false, "h": "027b2989ac8b2b9fed9003965247bd07f380d31eb183a40b3e4ea9a312f15834"}, {"id": "fq10", "q": "The DSUR reporting period starts from the:", "o": ["International Birth Date", "Development International Birth Date", "First inspection date", "Date of the first SUSAR"], "tf": false, "h": "a7a6f4972fd805a656be3e415c66d0d339fae88998b3e1f05d2c384873540b0f"}, {"id": "fq11", "q": "A DSUR is due within how many days of its data lock point?", "o": ["15", "60", "70", "90"], "tf": false, "h": "219cef1a9399a6a0d15cf887cf7e2ed3f18a895c24cf8b30ff3859cad17e3f8c"}, {"id": "fq12", "q": "The PBRER section that weighs benefits against risks for approved indications is the:", "o": ["Integrated benefit-risk analysis", "Summary tabulations", "Worldwide marketing approval status", "Appendices"], "tf": false, "h": "b1b313bc25325cb740f443c1c61a127e1b46616b05b570fa8b3f469a09daabfd"}, {"id": "fq13", "q": "Which date sets PSUR/PBRER reporting periods?", "o": ["International Birth Date", "Development International Birth Date", "Date of QPPV appointment", "Product launch in Nigeria only"], "tf": false, "h": "7dea7ea1cfe9f7029c26a5fec665214877bcfb57cbd2e894171f162d7fbf497a"}, {"id": "fq14", "q": "In an RMP, an unconfirmed but plausible risk is listed as:", "o": ["An important identified risk", "An important potential risk", "Missing information", "A routine measure"], "tf": false, "h": "800ace498f4d1cd884c2682e261de1f71aad4efcc0aa515e9d1d5fe3a8acd213"}, {"id": "fq15", "q": "Which document describes a company's whole PV system and must be kept at a site in Nigeria?", "o": ["The DSUR", "The PSMF", "The DHPC", "The Investigator's Brochure"], "tf": false, "h": "962ae6d75830864f81bf77865bc88e60ddc82628f964c48197b20998db8de447"}, {"id": "fq16", "q": "A finding that could affect patient safety or is a breach of legal requirements, but is not critical, is graded:", "o": ["Minor", "Major", "Observation", "Closed"], "tf": false, "h": "20772869eb7da66b294a5f3c6444cc6963427035fcda5d1cc2c5dcabcc11f6ab"}, {"id": "fq17", "q": "A CAPA plan is incomplete without:", "o": ["An effectiveness check", "A press release", "A new QPPV", "A product recall"], "tf": false, "h": "7a90d129fa1e722c53e83af8dc7b83304680866ca00e368c883474a9ffca3451"}, {"id": "fq18", "q": "When answering a NAFDAC information request, the writer should:", "o": ["Answer each question in order, as asked, with data", "Send the latest PSUR instead", "Combine all questions into one paragraph", "Reply only by phone"], "tf": false, "h": "7162196e2dc0b1b3d5e70e843cf174a161f0a21461ff2cc609640749785b35e9"}, {"id": "fq19", "q": "Which statement about signals is correct?", "o": ["Every signal confirms a risk", "A signal is a lead that needs investigation and may be closed with no action", "Signals are only found in clinical trials", "Signals replace ICSR reporting"], "tf": false, "h": "284b3a90dfeb03d34c1d09a5545ed5b3cb938bca0ed120df867cdde0a0755753"}, {"id": "fq20", "q": "A DHPC for Nigerian healthcare professionals should tell readers how to report suspected ADRs through:", "o": ["Social media only", "National channels such as the Yellow Form, VigiFlow e-form or Med Safety app, and the company", "The company's sales team only", "It does not need to mention reporting"], "tf": false, "h": "dd7716ce550bba7937b68a2a79b5626eddad70712e9589c8d967859ccaef9291"}]}};
const OVERVIEW = -1, FINAL = -2, CERT = -3, REG = -4;
const N = COURSE.modules.length;
const SIGNATORY = "Dr Seun Alabi";
const COURSE_NAME = "Pharmacovigilance Continuing Education Course Series";

/* ---------- storage ---------- */
const LEARNER_KEY = "pv-ce-learner";
const PROG_PREFIX = "pv-ce-progress-v2:";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

let learner = null;
try { learner = JSON.parse(lsGet(LEARNER_KEY) || "null"); } catch (e) { learner = null; }
if (!learner || !learner.name || !learner.email) learner = null;
let progress = {};
function loadProgress() {
  try { progress = JSON.parse(lsGet(PROG_PREFIX + learner.email.toLowerCase()) || "{}") || {}; } catch (e) { progress = {}; }
}
function save() { lsSet(PROG_PREFIX + learner.email.toLowerCase(), JSON.stringify(progress)); }

/* ---------- helpers ---------- */
const enc = new TextEncoder();
async function digest(s) {
  const buf = await crypto.subtle.digest("SHA-256", enc.encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function isCorrect(q, text) { return (await digest(COURSE.salt + "|" + q.id + "|" + text)) === q.h; }
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (tag, attrs = {}, html) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; };
const fmtDateTime = iso => new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" }).format(new Date(iso));

function modState(i) { return progress["m" + i] || null; }
function doneCount() { return COURSE.modules.filter((_, i) => modState(i) && modState(i).done).length; }
function finalState() { return progress.final || null; }
function finalPassed() { const f = finalState(); return !!(f && f.best >= COURSE.final.passMark); }
function earned() { return doneCount() === N && finalPassed(); }
function tracks() {
  const out = [];
  COURSE.modules.forEach((m, i) => {
    let t = out.find(x => x.name === m.track);
    if (!t) { t = { name: m.track, blurb: m.trackBlurb, idx: [] }; out.push(t); }
    t.idx.push(i);
  });
  return out;
}
async function checkEarned() {
  if (earned() && !progress.earnedAt) {
    progress.earnedAt = new Date().toISOString();
    const h = (await digest("cert|" + learner.email.toLowerCase() + "|" + progress.earnedAt)).toUpperCase();
    progress.certId = `PVCE-${h.slice(0, 4)}-${h.slice(4, 8)}`;
    save();
  }
}

/* ---------- optional completion register (shared db) ---------- */
let db = null, uid = null, isOwner = false, dbWritable = true;
async function initRuntime() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    db = d;
    if (u) { uid = await u.id(); isOwner = await u.isOwner(); }
  } catch (e) { db = null; }
  if (isOwner && document.getElementById("toc")) renderToc(currentView);
  syncRecord();
}
let syncing = false, syncAgain = false;
async function syncRecord() {
  if (!db || !uid || !learner || !dbWritable) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  const f = finalState();
  try {
    await db.doc("learners/" + uid).set({
      name: learner.name, email: learner.email,
      modulesDone: doneCount(), modulesTotal: N,
      finalBest: f ? f.best : null,
      earnedAt: progress.earnedAt || null, certId: progress.certId || null,
      updatedAt: new Date().toISOString(),
    });
  } catch (e) { dbWritable = false; }
  syncing = false;
  if (syncAgain) { syncAgain = false; syncRecord(); }
}

/* ---------- sign in ---------- */
function renderSignin() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="signin-wrap"><div class="signin">
      <div class="brand"><div class="eyebrow">Continuing education</div><h1>Pharmacovigilance CE Course</h1></div>
      <p>Sign in to start or continue the course. Your name appears on your certificate of completion exactly as you type it here.</p>
      <form id="signin-form" novalidate>
        <div class="field"><label for="signin-name">Full name</label><input id="signin-name" name="name" type="text" autocomplete="name" maxlength="80" required placeholder="e.g. Adaeze Okafor"><span class="err" id="signin-name-err"></span></div>
        <div class="field"><label for="signin-email">Email address</label><input id="signin-email" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="you@example.com"><span class="err" id="signin-email-err"></span></div>
        <button class="btn" type="submit">Sign in and continue</button>
      </form>
      <p class="note">Your progress is saved in this browser under your email address. Your name, email and course results may be recorded for the course administrator to confirm completion.</p>
    </div></div>`;
  const form = document.getElementById("signin-form");
  form.addEventListener("submit", ev => {
    ev.preventDefault();
    const nameIn = document.getElementById("signin-name"), emailIn = document.getElementById("signin-email");
    const name = nameIn.value.trim().replace(/\s+/g, " ");
    const email = emailIn.value.trim();
    let ok = true;
    const nameErr = name.length < 3 || !/\s/.test(name) ? "Enter your full name (first name and surname)." : "";
    const emailErr = !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "Enter a valid email address, for example name@example.com." : "";
    for (const [inp, err, msg] of [[nameIn, "signin-name-err", nameErr], [emailIn, "signin-email-err", emailErr]]) {
      document.getElementById(err).textContent = msg;
      inp.setAttribute("aria-invalid", msg ? "true" : "false");
      if (msg && ok) { inp.focus(); ok = false; }
    }
    if (!ok) return;
    learner = { name, email };
    lsSet(LEARNER_KEY, JSON.stringify(learner));
    startCourse();
  });
}
function signOut() {
  lsDel(LEARNER_KEY);
  learner = null;
  progress = {};
  renderSignin();
}

/* ---------- course shell ---------- */
let currentView = OVERVIEW;
function startCourse() {
  loadProgress();
  document.getElementById("app").innerHTML = `
    <div class="shell">
      <nav class="index" aria-label="Course modules">
        <div class="brand"><div class="eyebrow">Continuing education</div><h1>Pharmacovigilance CE Course</h1></div>
        <div class="who"><span>Signed in as <b>${esc(learner.name)}</b></span><button type="button" class="linkbtn" id="signout">Not you? Sign out</button></div>
        <div class="meter"><div class="meter-bar"><div class="meter-fill" id="meter-fill"></div></div><div class="meter-text" id="meter-text"></div></div>
        <ol class="toc" id="toc"></ol>
      </nav>
      <main id="main" tabindex="-1"></main>
    </div>`;
  document.getElementById("signout").addEventListener("click", signOut);
  let start = OVERVIEW;
  const v = parseInt(lsGet(PROG_PREFIX + "last") || "", 10);
  if (!isNaN(v) && v >= CERT && v < N) start = v;
  const hash = (location.hash || "").replace("#", "");
  const hm = /^module(\d+)$/.exec(hash);
  if (hm) { const n = parseInt(hm[1], 10) - 1; if (n >= 0 && n < N) start = n; }
  if (hash === "final") start = FINAL;
  if (hash === "certificate") start = CERT;
  go(start);
  syncRecord();
}

function tocButton(label, n, idx, current, st) {
  const li = el("li");
  const b = el("button", { type: "button", "aria-current": String(idx === current) });
  b.innerHTML = `<span class="n">${n}</span><span class="t">${label}</span>${st || '<span class="st"></span>'}`;
  b.addEventListener("click", () => go(idx));
  li.appendChild(b);
  return li;
}
function renderToc(current) {
  const toc = document.getElementById("toc");
  if (!toc) return;
  toc.innerHTML = "";
  toc.appendChild(tocButton("Start here", "··", OVERVIEW, current));
  for (const t of tracks()) {
    toc.appendChild(el("li", { class: "grp", "aria-hidden": "true" }, esc(t.name)));
    for (const i of t.idx) {
      const s = modState(i);
      const st = s && s.done ? `<span class="st done">${s.score}/${COURSE.modules[i].quiz.length}</span>` : "";
      toc.appendChild(tocButton(COURSE.modules[i].short, pad(i + 1), i, current, st));
    }
  }
  toc.appendChild(el("li", { class: "grp", "aria-hidden": "true" }, "Assessment"));
  const f = finalState();
  toc.appendChild(tocButton("Final assessment", "FA", FINAL, current, f ? `<span class="st ${finalPassed() ? "done" : ""}">${f.best}%</span>` : ""));
  toc.appendChild(tocButton("Certificate", "✓", CERT, current, progress.earnedAt ? '<span class="st done">Earned</span>' : ""));
  if (isOwner && db) {
    toc.appendChild(el("li", { class: "grp", "aria-hidden": "true" }, "Administrator"));
    toc.appendChild(tocButton("Completion register", "≡", REG, current));
  }
  const d = doneCount();
  document.getElementById("meter-fill").style.width = (d / N * 100) + "%";
  document.getElementById("meter-text").textContent = `${d} of ${N} knowledge checks completed`;
}

function go(idx) {
  currentView = idx;
  lsSet(PROG_PREFIX + "last", String(idx));
  if (idx === OVERVIEW) renderIntro();
  else if (idx === FINAL) renderFinal();
  else if (idx === CERT) renderCert();
  else if (idx === REG) renderRegister();
  else renderModule(idx);
  renderToc(idx);
  document.getElementById("main").focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function pageShell() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const page = el("article", { class: "page" });
  main.appendChild(page);
  return page;
}
function pager(page, prevLabel, prevIdx, nextLabel, nextIdx) {
  const p = el("div", { class: "pager" });
  if (prevLabel) { const b = el("button", { type: "button", class: "btn ghost" }, prevLabel); b.addEventListener("click", () => go(prevIdx)); p.appendChild(b); } else p.appendChild(el("span"));
  if (nextLabel) { const b = el("button", { type: "button", class: "btn" }, nextLabel); b.addEventListener("click", () => go(nextIdx)); p.appendChild(b); }
  page.appendChild(p);
}

function renderIntro() {
  const page = pageShell();
  page.innerHTML = `
    <div class="mod-eyebrow">Course overview</div>
    <h2>Welcome, ${esc(learner.name.split(" ")[0])}</h2>
    <p>This course gives healthcare professionals and industry PV staff structured continuing education in pharmacovigilance. It has ${N} modules in two parts, a ${COURSE.final.quiz.length}-question final assessment and a certificate of completion. Each module has learning objectives, plain-language content, worked examples, key takeaways and a knowledge check.</p>
    <h3>How to use it</h3>
    <ol class="intro-list">
      <li>Work through the modules in order. Part 1 builds the foundations; Part 2 applies them to company PV practice and NAFDAC requirements in Nigeria.</li>
      <li>Answer the knowledge check at the end of each module. Each answer is marked right or wrong as soon as you check it. If you miss a question, reread the module and retake the check.</li>
      <li>When every knowledge check is complete, take the final assessment. A score of ${COURSE.final.passMark}% or more issues your certificate automatically, dated and timed, ready to download and print.</li>
    </ol>
    <p class="note">The examples are illustrative scenarios written for teaching. Product names are generic, and patients are fictional. Regulatory details in Part 2 cite their source documents; always confirm against the current version from NAFDAC before applying them.</p>`;
  for (const t of tracks()) {
    page.appendChild(el("div", { class: "track-head" }, `<h3>${esc(t.name)}</h3>${t.blurb ? `<p>${t.blurb}</p>` : ""}`));
    const grid = el("div", { class: "summary-grid" });
    for (const i of t.idx) {
      const m = COURSE.modules[i], s = modState(i);
      const b = el("button", { type: "button" });
      b.innerHTML = `<span class="n">Module ${pad(i + 1)}</span><span>${m.short}</span><span class="s ${s && s.done ? "done" : ""}">${s && s.done ? `Completed · ${s.score} of ${m.quiz.length} correct` : "Not started"}</span>`;
      b.addEventListener("click", () => go(i));
      grid.appendChild(b);
    }
    page.appendChild(grid);
  }
  const next = COURSE.modules.findIndex((_, i) => !(modState(i) && modState(i).done));
  pager(page, null, null, next < 0 ? (progress.earnedAt ? "View certificate" : "Final assessment") : (next === 0 ? "Start Module 1" : `Continue with Module ${next + 1}`), next < 0 ? (progress.earnedAt ? CERT : FINAL) : next);
}

function renderModule(i) {
  const m = COURSE.modules[i];
  const page = pageShell();
  page.innerHTML = `
    <div class="mod-eyebrow">${esc(m.track)} · Module ${pad(i + 1)} of ${N}</div>
    <h2>${m.title}</h2>
    <div class="objectives"><div class="lbl">Learning objectives</div><ul>${m.objectives.map(o => `<li>${o}</li>`).join("")}</ul></div>
    <h3>Course content</h3>
    <div class="content">${m.content}</div>
    <div class="takeaways"><div class="lbl">Key takeaways</div><ul>${m.takeaways.map(t => `<li>${t}</li>`).join("")}</ul></div>
    ${m.sources ? `<div class="sources"><div class="lbl">Sources</div><ul>${m.sources.map(s => `<li>${s}</li>`).join("")}</ul></div>` : ""}
    <h3 id="check">Knowledge check</h3>`;
  page.appendChild(renderQuiz(m.quiz, {
    intro: `${m.quiz.length} questions. Choose one answer for each question and select <strong>Check answer</strong>. Each answer is marked right or wrong once it is checked.`,
    wrongNote: "Review the module content and examples, then retake the check.",
    async onDone(score) {
      progress["m" + i] = { done: true, score }; save();
      await checkEarned(); renderToc(i); syncRecord();
      return `<div><div class="verdict-note">Knowledge check complete</div><strong>${score} of ${m.quiz.length} correct</strong></div>`;
    },
    retakeLabel: "Retake knowledge check",
  }));
  pager(page,
    i === 0 ? "← Overview" : `← Module ${i}`, i === 0 ? OVERVIEW : i - 1,
    i < N - 1 ? `Module ${i + 2} →` : "Final assessment →", i < N - 1 ? i + 1 : FINAL);
}

function renderFinal() {
  const page = pageShell();
  const F = COURSE.final, f = finalState(), d = doneCount();
  page.innerHTML = `
    <div class="mod-eyebrow">Assessment</div>
    <h2>Final assessment</h2>
    <p>${F.quiz.length} questions drawn from all ${N} modules. Each answer is marked right or wrong once checked; the correct option is never shown. The pass mark is ${F.passMark}%. You can retake the assessment, and your best score counts.</p>
    ${d < N ? `<p class="note">You have completed ${d} of ${N} knowledge checks. You can take the assessment now, but your certificate is issued only when every knowledge check is also complete.</p>` : ""}
    ${f ? `<p>Best score so far: <strong>${f.best}%</strong> <span class="pill ${finalPassed() ? "pass" : "fail"}">${finalPassed() ? "Passed" : "Not yet passed"}</span></p>` : ""}`;
  page.appendChild(renderQuiz(F.quiz, {
    intro: "Choose one answer for each question and select <strong>Check answer</strong>.",
    wrongNote: "",
    async onDone(score) {
      const pct = Math.round(score / F.quiz.length * 100);
      const prev = finalState();
      progress.final = { best: Math.max(pct, prev ? prev.best : 0), last: pct };
      save(); await checkEarned(); renderToc(FINAL); syncRecord();
      const pass = pct >= F.passMark;
      return `<div><div class="verdict-note">Final assessment complete</div><strong>${score} of ${F.quiz.length} correct · ${pct}%</strong> <span class="pill ${pass ? "pass" : "fail"}">${pass ? "Passed" : "Below pass mark"}</span></div>`;
    },
    retakeLabel: "Retake final assessment",
    extra(box) { const b = el("button", { type: "button", class: "btn" }, progress.earnedAt ? "View your certificate" : "Check certificate status"); b.addEventListener("click", () => go(CERT)); box.appendChild(b); },
  }));
  pager(page, `← Module ${N}`, N - 1, "Certificate →", CERT);
}

/* ---------- certificate ---------- */
async function drawCertificate() {
  const W = 2480, H = 1754;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  try {
    await Promise.all(['700 120px "Bricolage Grotesque"', '500 72px "Bricolage Grotesque"', '44px "Atkinson Hyperlegible"', '28px "IBM Plex Mono"', '120px "Great Vibes"'].map(f => document.fonts.load(f)));
  } catch (e) {}
  const INK = "#142229", MUTED = "#546770", ACCENT = "#1d5f86", RULE = "#c9d6dc", CASE = "#2f7a68";
  const DISPLAY = '"Bricolage Grotesque", "Segoe UI", sans-serif', BODY = '"Atkinson Hyperlegible", "Segoe UI", sans-serif', MONO = '"IBM Plex Mono", monospace', SCRIPT = '"Great Vibes", "Brush Script MT", cursive';
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
  g.strokeStyle = INK; g.lineWidth = 8; g.strokeRect(70, 70, W - 140, H - 140);
  g.strokeStyle = CASE; g.lineWidth = 2; g.strokeRect(98, 98, W - 196, H - 196);
  g.fillStyle = ACCENT; g.fillRect(W / 2 - 90, 98, 180, 10);
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  const spaced = (txt, x, y, font, color, spacing) => {
    g.font = font; g.fillStyle = color;
    const chars = [...txt]; const widths = chars.map(ch => g.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
    let cx = x - total / 2; g.textAlign = "left";
    chars.forEach((ch, k) => { g.fillText(ch, cx, y); cx += widths[k] + spacing; });
    g.textAlign = "center";
  };
  const fit = (txt, weight, size, family, maxW) => { let s = size; do { g.font = `${weight} ${s}px ${family}`; s -= 2; } while (g.measureText(txt).width > maxW && s > 30); return g.font; };
  spaced("CERTIFICATE OF COMPLETION", W / 2, 300, `500 40px ${MONO}`, ACCENT, 14);
  g.font = `44px ${BODY}`; g.fillStyle = MUTED; g.fillText("This certifies that", W / 2, 440);
  g.font = fit(learner.name, 700, 124, DISPLAY, 1900); g.fillStyle = INK; g.fillText(learner.name, W / 2, 600);
  g.strokeStyle = RULE; g.lineWidth = 3; g.beginPath(); g.moveTo(W / 2 - 800, 650); g.lineTo(W / 2 + 800, 650); g.stroke();
  g.font = `34px ${MONO}`; g.fillStyle = MUTED; g.fillText(learner.email, W / 2, 712);
  g.font = `44px ${BODY}`; g.fillStyle = MUTED; g.fillText("has successfully completed the", W / 2, 820);
  g.font = fit(COURSE_NAME, 500, 76, DISPLAY, 2000); g.fillStyle = INK; g.fillText(COURSE_NAME, W / 2, 930);
  g.font = `500 40px ${DISPLAY}`; g.fillStyle = MUTED;
  g.fillText(`${N} modules, including Pharmacovigilance Practice and NAFDAC Requirements`, W / 2, 1010);
  g.fillText(`Final assessment score: ${finalState().best}%  ·  Pass mark: ${COURSE.final.passMark}%`, W / 2, 1070);
  const baseY = 1440;
  const block = (x, label, value) => {
    g.font = `500 26px ${MONO}`; g.fillStyle = MUTED;
    spaced(label.toUpperCase(), x, baseY + 70, `500 26px ${MONO}`, MUTED, 4);
    g.font = `500 42px ${DISPLAY}`; g.fillStyle = INK; g.fillText(value, x, baseY);
    g.strokeStyle = RULE; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 330, baseY + 26); g.lineTo(x + 330, baseY + 26); g.stroke();
  };
  block(560, "Date and time of completion", fmtDateTime(progress.earnedAt));
  block(W / 2, "Certificate ID", progress.certId);
  const sx = W - 560;
  g.font = `130px ${SCRIPT}`; g.fillStyle = "#1b2f6b"; g.fillText(SIGNATORY.replace(/^Dr\.?\s+/, ""), sx, baseY - 10);
  g.strokeStyle = INK; g.lineWidth = 3; g.beginPath(); g.moveTo(sx - 330, baseY + 26); g.lineTo(sx + 330, baseY + 26); g.stroke();
  g.font = `600 40px ${BODY}`; g.fillStyle = INK; g.fillText(SIGNATORY, sx, baseY + 82);
  return c;
}

async function renderCert() {
  const page = pageShell();
  const d = doneCount(), f = finalState();
  page.innerHTML = `<div class="mod-eyebrow">Certificate of completion</div><h2>Your certificate</h2>`;
  if (!progress.earnedAt) {
    page.appendChild(el("p", {}, "Your certificate is issued automatically, with the date and time, as soon as both requirements are met:"));
    page.appendChild(el("ul", { class: "req" }, `
      <li><span class="mark ${d === N ? "ok" : "no"}">${d === N ? "✓" : "○"}</span><span>Complete all ${N} knowledge checks (${d} of ${N} done)</span></li>
      <li><span class="mark ${finalPassed() ? "ok" : "no"}">${finalPassed() ? "✓" : "○"}</span><span>Score ${COURSE.final.passMark}% or more on the final assessment (${f ? `best so far ${f.best}%` : "not taken yet"})</span></li>`));
    pager(page, "← Overview", OVERVIEW, d < N ? "Continue the course" : "Take the final assessment", d < N ? COURSE.modules.findIndex((_, i) => !(modState(i) && modState(i).done)) : FINAL);
    return;
  }
  page.appendChild(el("p", {}, `Congratulations, ${esc(learner.name)}. You completed the course on <strong>${esc(fmtDateTime(progress.earnedAt))}</strong>. Download the PDF to print it or keep a copy.`));
  const status = el("p", { class: "note" }, "Preparing your certificate…");
  page.appendChild(status);
  const canvas = await drawCertificate();
  const png = canvas.toDataURL("image/png");
  const img = el("img", { class: "cert-img", src: png, alt: `Certificate of completion for ${learner.name}, ${COURSE_NAME}, completed ${fmtDateTime(progress.earnedAt)}, signed by ${SIGNATORY}` });
  status.replaceWith(img);
  const actions = el("div", { class: "cert-actions" });
  const pdfBtn = el("button", { type: "button", class: "btn" }, "Download PDF to print");
  const pngBtn = el("button", { type: "button", class: "btn ghost" }, "Download image (PNG)");
  const msg = el("span", { class: "verdict-note", "aria-live": "polite" });
  actions.append(pdfBtn, pngBtn, msg);
  page.appendChild(actions);
  const fname = `PV-CE-Certificate-${learner.name.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "")}`;
  const downloads = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads").catch(() => null) : null;
  if (!downloads) {
    actions.innerHTML = "";
    actions.appendChild(el("p", { class: "note" }, "To keep or print your certificate, right-click or long-press the certificate image above and save it, then print the saved image."));
  }
  if (!window.jspdf) pdfBtn.remove();
  async function offer(btn, filename, data) {
    btn.disabled = true; msg.textContent = "";
    try { const r = await downloads.save({ filename, data }); if (r && r.status === "saved") msg.textContent = "Saved."; }
    catch (e) {
      if (e && e.code === "declined") msg.textContent = "";
      else if (e && e.code === "rate_limited") msg.textContent = "A save prompt is already open.";
      else msg.textContent = "Saving isn't available here. Right-click or long-press the image above to save it.";
    }
    btn.disabled = false;
  }
  pdfBtn.addEventListener("click", () => {
    const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    doc.setProperties({ title: `Certificate of completion: ${learner.name}`, subject: COURSE_NAME, author: SIGNATORY });
    doc.addImage(png, "PNG", 0, 0, 297, 210);
    offer(pdfBtn, fname + ".pdf", doc.output("blob"));
  });
  pngBtn.addEventListener("click", () => canvas.toBlob(b => offer(pngBtn, fname + ".png", b), "image/png"));
  pager(page, "← Final assessment", FINAL, "Course overview", OVERVIEW);
}

/* ---------- administrator register ---------- */
async function renderRegister() {
  const page = pageShell();
  page.innerHTML = `<div class="mod-eyebrow">Administrator</div><h2>Completion register</h2>
    <p>Learners who signed in with access to save course data. Only you can see this page. Learners with view-only access to the course still get their certificate, but their record cannot be saved here.</p>`;
  const box = el("div", { class: "reg" }, '<p class="note">Loading…</p>');
  page.appendChild(box);
  try {
    const snap = await db.collection("learners").orderBy("updatedAt", "desc").limit(1000).get();
    if (snap.empty) { box.innerHTML = '<p class="note">No learner records yet. Records appear here when learners sign in.</p>'; return; }
    const rows = snap.docs.map(d => d.data());
    box.innerHTML = `<div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Modules</th><th>Final</th><th>Completed</th><th>Certificate ID</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.name || "")}</td><td>${esc(r.email || "")}</td><td class="num">${esc(r.modulesDone ?? 0)}/${esc(r.modulesTotal ?? N)}</td><td class="num">${r.finalBest == null ? "—" : esc(r.finalBest) + "%"}</td><td class="num">${r.earnedAt ? esc(fmtDateTime(r.earnedAt)) : "—"}</td><td class="num">${esc(r.certId || "—")}</td></tr>`).join("")}</tbody></table></div>`;
  } catch (e) {
    box.innerHTML = '<p class="note">The register could not be loaded. Reload the page to try again.</p>';
  }
}

/* ---------- quiz ---------- */
function renderQuiz(quiz, opts) {
  const wrap = el("div", { class: "quiz" });
  wrap.appendChild(el("p", { class: "quiz-intro" }, opts.intro));
  const results = {};
  const scoreBox = el("div", { class: "score", hidden: "" });
  async function finish() {
    if (Object.keys(results).length < quiz.length) return;
    const score = Object.values(results).filter(Boolean).length;
    scoreBox.hidden = false;
    scoreBox.innerHTML = await opts.onDone(score);
    const actions = el("div", { class: "q-foot" });
    const retake = el("button", { type: "button", class: "btn ghost" }, opts.retakeLabel);
    retake.addEventListener("click", () => { const fresh = renderQuiz(quiz, opts); wrap.replaceWith(fresh); fresh.scrollIntoView({ block: "start" }); });
    actions.appendChild(retake);
    if (opts.extra) opts.extra(actions);
    scoreBox.appendChild(actions);
  }
  quiz.forEach((q, qi) => {
    const box = el("div", { class: "q" });
    const fs = el("fieldset");
    fs.appendChild(el("legend", {}, `<span class="qn">${qi + 1}.</span>${q.q}`));
    const order = q.tf ? q.o : shuffled(q.o);
    const name = `${q.id}-${Math.random().toString(36).slice(2, 7)}`;
    order.forEach((text, oi) => {
      const id = `${name}-${oi}`;
      const lab = el("label", { class: "opt", for: id });
      lab.appendChild(el("input", { type: "radio", name, id, value: String(oi) }));
      lab.appendChild(el("span", {}, text));
      fs.appendChild(lab);
    });
    box.appendChild(fs);
    const foot = el("div", { class: "q-foot" });
    const btn = el("button", { type: "button", class: "btn", disabled: "" }, "Check answer");
    const out = el("span", { "aria-live": "polite" });
    foot.append(btn, out);
    box.appendChild(foot);
    fs.addEventListener("change", () => { btn.disabled = false; });
    btn.addEventListener("click", async () => {
      const picked = fs.querySelector("input:checked");
      if (!picked) return;
      btn.disabled = true;
      let ok = false;
      try { ok = await isCorrect(q, order[Number(picked.value)]); }
      catch (e) { out.innerHTML = `<span class="verdict wrong">This browser could not check the answer. Open the course in an up-to-date browser.</span>`; btn.disabled = false; return; }
      results[q.id] = ok;
      fs.querySelectorAll("input").forEach(inp => { inp.disabled = true; });
      box.classList.add("locked", ok ? "right" : "wrong");
      picked.closest(".opt").classList.add(ok ? "picked-right" : "picked-wrong");
      btn.remove();
      out.innerHTML = ok
        ? `<span class="verdict right">✓ Correct</span>`
        : `<span class="verdict wrong">✗ Incorrect</span>${opts.wrongNote ? ` <span class="verdict-note">${opts.wrongNote}</span>` : ""}`;
      finish();
    });
    wrap.appendChild(box);
  });
  wrap.appendChild(scoreBox);
  return wrap;
}

/* ---------- boot ---------- */
if (learner) startCourse(); else renderSignin();
initRuntime();
